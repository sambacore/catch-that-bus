// ---- GAME INIT ----
function initLevel(idx) {
  const lvl = LEVELS[idx];
  map = lvl.map.map(r => [...r]); // deep copy so doors can be opened
  buildVariantGrid(lvl);
  applyLevelPalette(lvl);
  player = { x: lvl.player.x, y: lvl.player.y, angle: lvl.player.angle };
  enemies = lvl.enemies.map(e => ({
    x: e.x, y: e.y, type: e.type,
    passive: !!e.passive, crowd: !!e.crowd, secret: !!e.secret,
    hp: ENEMY_TYPES[e.type].hp, alive: true, attackTimer: 0, hitTimer: 0, painTimer: 0,
    animState: 'walk', animFrame: 0, animTimer: 0,
  }));
  totalEnemies = enemies.filter(e => !e.passive && !e.secret).length;
  pickups = (lvl.pickups || []).map(p => ({ x: p.x, y: p.y, type: p.type, amount: p.amount, weapon: p.weapon, taken: false }));
  doorStates = {}; // reset door animation state
  switchStates = {}; // reset switch states
  secretsRevealed = false; // chamber sleepers don't count until their room is opened
  // Initialize switch states for this level
  if (lvl.switches) {
    lvl.switches.forEach((sw, idx) => {
      switchStates[idx] = { activated: false };
    });
  }
  // Weapons carry over between levels; reset only on a fresh start
  firing = false;
  shootCooldown = WEAPONS[currentWeapon].cooldown;
  updateWeaponSlots();
  ammo = 50; health = 100; kills = 0; shootTimer = 0; damageTimer = 0; msgTimer = 0; bobPhase = 0;
}

function startGame(startIdx) {
  currentLevel = (typeof startIdx === 'number' && startIdx >= 0 && startIdx < LEVELS.length) ? startIdx : 0;
  ownedWeapons = [true, false, false, false]; // fresh run: pistol only
  currentWeapon = 0;
  initLevel(currentLevel);
  state = 'playing';
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('death-screen').style.display = 'none';
  document.getElementById('win-screen').style.display = 'none';
  showMsg(LEVELS[currentLevel].name, 120);
  try {
    const pl = canvas.requestPointerLock();
    if (pl && pl.catch) pl.catch(() => {}); // deep-link start has no user gesture yet
  } catch (e) {}
}

function restartGame() {
  initLevel(currentLevel);
  state = 'playing';
  document.getElementById('death-screen').style.display = 'none';
}

function nextLevel() {
  currentLevel = (currentLevel + 1) % LEVELS.length;
  initLevel(currentLevel);
  state = 'playing';
  document.getElementById('win-screen').style.display = 'none';
  showMsg(LEVELS[currentLevel].name, 90);
}

function showMsg(text, frames) {
  const el = document.getElementById('message');
  el.textContent = text; el.style.display = 'block';
  msgTimer = frames;
}

// ---- WEAPON MANAGEMENT ----
function switchWeapon() {
  // Cycle to next owned weapon
  for (let i = 1; i <= 4; i++) {
    const wi = (currentWeapon + i) % 4;
    if (ownedWeapons[wi]) {
      currentWeapon = wi;
      shootTimer = 0;
      shootCooldown = WEAPONS[wi].cooldown;
      updateWeaponSlots();
      showMsg(WEAPONS[wi].name, 30);
      return;
    }
  }
}

function updateWeaponSlots() {
  // Only used now to show/hide the SWAP button — weapon slots removed from HUD.
  const ownedCount = ownedWeapons.filter(Boolean).length;
  const swapBtn = document.getElementById('btn-switch');
  if (swapBtn) swapBtn.style.display = ownedCount > 1 ? 'flex' : 'none';
}

// ---- SHOOT ----
function shoot() {
  if (state !== 'playing' || shootTimer > 0 || ammo <= 0) return;
  const weapon = WEAPONS[currentWeapon];
  if (ammo < weapon.ammoPerShot) return;
  ammo -= weapon.ammoPerShot;
  shootTimer = weapon.cooldown;
  shootCooldown = weapon.cooldown;
  recoilOffset = 1; // trigger recoil animation

  // Fire pellets
  for (let p = 0; p < weapon.pellets; p++) {
    const spread = (Math.random() - 0.5) * weapon.spread * 2;
    const angle = player.angle + spread;
    const dx = Math.cos(angle), dy = Math.sin(angle);
    let closestHit = null, closestDist = Infinity;
    for (const e of enemies) {
      if (!e.alive) continue;
      const ex = e.x - player.x, ey = e.y - player.y;
      const proj = ex * dx + ey * dy;
      if (proj < 0.3) continue;
      const perp = Math.abs(ex * dy - ey * dx);
      if (perp < ENEMY_TYPES[e.type].size && proj < closestDist) {
        if (!wallBetween(player.x, player.y, e.x, e.y)) {
          closestDist = proj; closestHit = e;
        }
      }
    }
    if (closestHit) {
      closestHit.hp -= weapon.damage;
      closestHit.hitTimer = 8; closestHit.painTimer = 20;
      if (closestHit.hp <= 0 && closestHit.alive) {
        closestHit.alive = false;
        closestHit.deathTimer = 45; // ~0.75s collapse animation at 60fps
        if (!closestHit.passive) kills++; // pacifist bystanders aren't bounty
      }
    }
  }
}

function wallBetween(x1, y1, x2, y2) {
  const d = Math.hypot(x2-x1, y2-y1);
  const steps = Math.ceil(d * 5);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const mx = x1 + (x2-x1)*t, my = y1 + (y2-y1)*t;
    const tx = Math.floor(mx), ty = Math.floor(my);
    const tile = map[ty]?.[tx];
    if (tile && tile > 0) {
      // Doors that are mostly open don't block
      if ((tile === 2 || tile === 6 || tile === 8) && doorStates[tx+','+ty] && doorStates[tx+','+ty].openProgress > 0.9) continue;
      return true;
    }
  }
  return false;
}

function useDoor() {
  const dx = Math.cos(player.angle), dy = Math.sin(player.angle);
  // Scan up to 3 tiles ahead
  const found = { tx: -1, ty: -1, tile: 0 };
  for (let step = 1; step <= 3; step++) {
    const dist = step * 0.9;
    const tx = Math.floor(player.x + dx * dist);
    const ty = Math.floor(player.y + dy * dist);
    if (ty < 0 || ty >= map.length || tx < 0 || tx >= map[0].length) break;
    const tile = map[ty][tx];
    if (tile === 2 || tile === 5 || tile === 6 || tile === 7) {
      found.tx = tx; found.ty = ty; found.tile = tile;
      break;
    }
    if (tile !== 0 && tile !== 8) break; // hit a wall, stop scanning (locked doors block)
  }

  // If nothing found directly ahead, check adjacent tiles (helps with diagonal approach)
  if (found.tile === 0) {
    const checkTiles = [
      [Math.floor(player.x + dx * 0.9) + 1, Math.floor(player.y + dy * 0.9)],
      [Math.floor(player.x + dx * 0.9) - 1, Math.floor(player.y + dy * 0.9)],
      [Math.floor(player.x + dx * 0.9), Math.floor(player.y + dy * 0.9) + 1],
      [Math.floor(player.x + dx * 0.9), Math.floor(player.y + dy * 0.9) - 1],
    ];
    for (const [tx, ty] of checkTiles) {
      if (ty < 0 || ty >= map.length || tx < 0 || tx >= map[0].length) continue;
      const tile = map[ty][tx];
      if (tile === 2 || tile === 5 || tile === 6 || tile === 7) {
        found.tx = tx; found.ty = ty; found.tile = tile;
        break;
      }
    }
  }

  if (found.tile === 0) return;

  const key = found.tx + ',' + found.ty;

  if (found.tile === 5) {
    // Exit
    state = 'won';
    document.getElementById('win-screen').style.display = 'flex';
    document.getElementById('win-msg').textContent = `Level ${currentLevel+1} cleared! ${kills}/${totalEnemies} kills.`;
    return;
  }

  if (found.tile === 8) {
    // Locked door — can't open directly, need a switch
    showMsg('LOCKED — FIND A SWITCH', 60);
    return;
  }

  if (found.tile === 6) {
    // Secret wall — start opening animation
    if (!doorStates[key] || !doorStates[key].opening) {
      doorStates[key] = { openProgress: 0, opening: true, isSecret: true };
      showMsg('SECRET FOUND!', 60);
      if (!secretsRevealed) {
        secretsRevealed = true;
        // Chamber sleepers wake and join the bounty; minimap fog lifts.
        const waking = enemies.filter(e => e.secret && !e.counted).length;
        enemies.forEach(e => { if (e.secret && !e.counted) e.counted = true; });
        totalEnemies += waking;
      }
    }
    return;
  }

  if (found.tile === 7) {
    // Switch — find which switch this is and activate it
    const lvl = LEVELS[currentLevel];
    if (!lvl.switches) return;
    for (let si = 0; si < lvl.switches.length; si++) {
      const sw = lvl.switches[si];
      if (sw.x === found.tx && sw.y === found.ty) {
        if (switchStates[si] && switchStates[si].activated) {
          showMsg('ALREADY ACTIVATED', 40);
          return;
        }
        switchStates[si] = { activated: true };
        // Win-switch (the bus seat) — no door targets, just end the level
        if (sw.win) {
          startEnding();
          return;
        }
        // Open all target doors
        for (const [tx2, ty2] of sw.targets) {
          const dkey = tx2 + ',' + ty2;
          if (!doorStates[dkey] || !doorStates[dkey].opening) {
            doorStates[dkey] = { openProgress: 0, opening: true, isSecret: false };
          }
        }
        break;
      }
    }
    return;
  }

  if (found.tile === 2) {
    // Door — start opening animation
    if (!doorStates[key] || !doorStates[key].opening) {
      doorStates[key] = { openProgress: 0, opening: true, isSecret: false };
    }
    return;
  }
}

// ---- UPDATE ----
function update() {
  if (state !== 'playing') return;

  const moveSpeed = 0.085;
  const rotSpeed = 0.04;
  let dx = 0, dy = 0, moving = false;

  // Keyboard movement
  if (keys['w'] || keys['arrowup']) {
    dx += Math.cos(player.angle) * moveSpeed;
    dy += Math.sin(player.angle) * moveSpeed; moving = true;
  }
  if (keys['a']) {
    dx += Math.cos(player.angle - PI/2) * moveSpeed;
    dy += Math.sin(player.angle - PI/2) * moveSpeed; moving = true;
  }
  if (keys['d']) {
    dx += Math.cos(player.angle + PI/2) * moveSpeed;
    dy += Math.sin(player.angle + PI/2) * moveSpeed; moving = true;
  }
  if (keys['s'] || keys['arrowdown']) {
    dx -= Math.cos(player.angle) * moveSpeed;
    dy -= Math.sin(player.angle) * moveSpeed; moving = true;
  }
  // Arrow keys rotate (desktop)
  if (keys['arrowleft']) player.angle -= rotSpeed;
  if (keys['arrowright']) player.angle += rotSpeed;

  // Analog joystick movement (mobile)
  if (Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1) {
    const jx = Math.abs(joyX) > 0.1 ? joyX : 0;
    const jy = Math.abs(joyY) > 0.1 ? joyY : 0;
    // joyY negative = forward, positive = back; joyX positive = strafe right
    dx += (Math.cos(player.angle) * (-jy) + Math.cos(player.angle + PI/2) * jx) * moveSpeed;
    dy += (Math.sin(player.angle) * (-jy) + Math.sin(player.angle + PI/2) * jx) * moveSpeed;
    moving = true;
  }

  if (keys['e']) { useDoor(); keys['e'] = false; }

  // Normalize diagonal movement so it's not faster
  if (moving) {
    const len = Math.hypot(dx, dy);
    if (len > moveSpeed) {
      dx = dx / len * moveSpeed;
      dy = dy / len * moveSpeed;
    }
  }

  // Head bob
  isMoving = moving;
  if (moving) bobPhase += 0.12; else bobPhase += 0.02;

  // Collision (slide along walls)
  const margin = 0.25;
  const newX = player.x + dx, newY = player.y + dy;
  function isPassable(tx, ty, forEnemy) {
    if (ty < 0 || ty >= map.length || tx < 0 || tx >= map[0].length) return false;
    const tile = map[ty][tx];
    if (tile === 0 || tile === 5) return true;
    // Doors/secret walls that are sufficiently open are passable
    // Enemies can pass through doors that are partially open (>0.3), player needs >0.9
    if (tile === 2 || tile === 6 || tile === 8) {
      const ds = doorStates[tx+','+ty];
      if (ds) {
        const threshold = forEnemy ? 0.3 : 0.9;
        if (ds.openProgress > threshold) return true;
      }
      return false;
    }
    return false;
  }
  const canX = isPassable(Math.floor(newX + margin * (dx > 0 ? 1 : -1)), Math.floor(player.y), false);
  const canY = isPassable(Math.floor(player.x), Math.floor(newY + margin * (dy > 0 ? 1 : -1)), false);
  if (canX) player.x = newX;
  if (canY) player.y = newY;

  // Player-vs-enemy push collision: player can run through but gets a slight push-back
  // This gives a physical "bump" feel without blocking movement
  for (const e of enemies) {
    if (!e.alive) continue;
    const edx = player.x - e.x, edy = player.y - e.y;
    const edist = Math.hypot(edx, edy);
    const pushRange = ENEMY_TYPES[e.type].size + 0.3;
    if (edist < pushRange && edist > 0.01) {
      // Gentle push: move player away slightly (but allow pushing through)
      const pushStrength = 0.015 * (1 - edist / pushRange);
      player.x += (edx / edist) * pushStrength;
      player.y += (edy / edist) * pushStrength;
    }
  }

  // Timers
  if (shootTimer > 0) shootTimer--;
  if (damageTimer > 0) damageTimer--;
  if (msgTimer > 0) { msgTimer--; if (msgTimer <= 0) document.getElementById('message').style.display = 'none'; }

  // Auto-fire: if fire button held and weapon is automatic
  if (firing && WEAPONS[currentWeapon].auto && shootTimer <= 0) {
    shoot();
  }

  // Smooth recoil decay
  recoilOffset *= 0.75;

  // Animate doors
  for (const key in doorStates) {
    const ds = doorStates[key];
    if (ds.opening && ds.openProgress < 1) {
      ds.openProgress = Math.min(1, ds.openProgress + 1/12); // ~12 frames to open
      if (ds.openProgress >= 1) {
        const [tx, ty] = key.split(',').map(Number);
        map[ty][tx] = 0; // door fully open
      }
    }
  }

  // Pickup collisions
  for (const p of pickups) {
    if (p.taken) continue;
    const d = Math.hypot(p.x - player.x, p.y - player.y);
    if (d < 0.5) {
      if (p.type === 'health') {
        p.taken = true;
        health = Math.min(100, health + p.amount);
        showMsg('+' + p.amount + ' HP', 50);
      } else if (p.type === 'ammo') {
        p.taken = true;
        ammo += p.amount;
        showMsg('+' + p.amount + ' AMMO', 50);
      } else if (p.type === 'weapon') {
        p.taken = true;
        const wi = WEAPONS.findIndex(w => w.name === p.weapon);
        if (wi >= 0 && !ownedWeapons[wi]) {
          ownedWeapons[wi] = true;
          currentWeapon = wi;
          shootCooldown = WEAPONS[wi].cooldown;
          updateWeaponSlots();
          showMsg('PICKED UP ' + p.weapon + '!', 90);
        } else if (wi >= 0 && ownedWeapons[wi]) {
          // Already own it — bonus ammo
          ammo += 20;
          showMsg(p.weapon + ' AMMO +20', 50);
        }
      }
    }
  }

  // Enemy AI
  for (const e of enemies) {
    if (!e.alive) {
      // Death animation: sink + squash, then settle as a corpse
      if (e.deathTimer > 0) {
        e.deathTimer--;
        if (e.deathTimer === 0) e.deathDone = true;
      }
      continue;
    }
    if (e.hitTimer > 0) e.hitTimer--;
    if (e.painTimer > 0) e.painTimer--;
    e.attackTimer = Math.max(0, e.attackTimer - 1);

    // Animation state
    const etype = ENEMY_TYPES[e.type];
    e.animTimer++;
    if (e.animTimer > 8) { e.animTimer = 0; e.animFrame = (e.animFrame + 1) % 4; }
    if (e.painTimer > 0) e.animState = 'pain';
    else if (e.attackTimer > etype.attackCooldown - 10) e.animState = 'attack';
    else e.animState = 'walk';

    // Pacifists (bus passengers & crowd) — idlers, never move or attack
    if (e.passive) continue;
    // Chamber sleepers stay dormant until a secret wall is opened
    if (e.secret && !secretsRevealed) continue;

    const edx = player.x - e.x, edy = player.y - e.y;
    const dist = Math.hypot(edx, edy);

    // Move toward player (with wall collision)
    if (dist > 0.8 && dist < 10 && !wallBetween(e.x, e.y, player.x, player.y)) {
      const stepX = (edx / dist) * etype.speed;
      const stepY = (edy / dist) * etype.speed;
      const margin = 0.25;
      const newX = e.x + stepX;
      const newY = e.y + stepY;

      // Check if enemy is next to a door and needs to open it
      const dirX = edx / dist, dirY = edy / dist;
      const doorTX = Math.floor(e.x + dirX * 0.8);
      const doorTY = Math.floor(e.y + dirY * 0.8);
      const doorTile = map[doorTY]?.[doorTX];
      if (doorTile === 2 || doorTile === 6) {
        const key = doorTX + ',' + doorTY;
        if (!doorStates[key] || !doorStates[key].opening) {
          doorStates[key] = { openProgress: 0, opening: true, isSecret: doorTile === 6 };
        }
      }

      // Check collision with other enemies (per-axis)
      const canX = isPassable(Math.floor(newX + margin * (stepX > 0 ? 1 : -1)), Math.floor(e.y), true);
      const canY = isPassable(Math.floor(e.x), Math.floor(newY + margin * (stepY > 0 ? 1 : -1)), true);

      // Enemy-vs-enemy collision: don't move into another enemy's space
      let blockedX = false, blockedY = false;
      for (const other of enemies) {
        if (other === e || !other.alive) continue;
        if (Math.hypot(newX - other.x, e.y - other.y) < 0.5) { blockedX = true; }
        if (Math.hypot(e.x - other.x, newY - other.y) < 0.5) { blockedY = true; }
      }
      if (canX && !blockedX) e.x = newX;
      if (canY && !blockedY) e.y = newY;
    }

    // Attack
    if (dist < etype.attackRange && e.attackTimer <= 0 && !wallBetween(e.x, e.y, player.x, player.y)) {
      health -= etype.damage;
      damageTimer = 10;
      e.attackTimer = etype.attackCooldown;
      if (health <= 0) {
        health = 0; state = 'dead';
        document.getElementById('death-screen').style.display = 'flex';
        document.getElementById('death-msg').textContent = 'You missed your bus.';
      }
    }
  }

  // Pickup ammo near exit
  // Check exit proximity (E1M10 has no exit tile — that level ends at the bus)
  const exitTile = LEVELS[currentLevel].exit;
  if (exitTile && Math.floor(player.x) === exitTile.x && Math.floor(player.y) === exitTile.y) {
    state = 'won';
    document.getElementById('win-screen').style.display = 'flex';
    document.getElementById('win-msg').textContent = `Level ${currentLevel+1} cleared! ${kills}/${totalEnemies} kills.`;
  }

  // Update HUD
  const hpEl = document.getElementById('health-display');
  hpEl.textContent = `HP ${Math.ceil(health)}`;
  hpEl.className = health < 30 ? 'low' : '';
  document.getElementById('ammo-display').innerHTML = `${ammo} <span style="font-size:11px;color:#aa0;">${WEAPONS[currentWeapon].name}</span>`;
}

// ---- RENDER ----
let FOV = 60 * DEG;
const MAX_DEPTH = 46;

// Stable per-tile+type hash for variant selection (re-seeded per page load)
const variantSeed = (Math.random() * 0xffff) | 0;
function hash2(x, y, k) {
  let h = ((x | 0) * 73856093) ^ ((y | 0) * 19349663) ^ ((k === '7a' ? 7919 : (k | 0) * 83492791) + variantSeed * 613);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0);
}

// Precompute per-tile variant indices with a scan-order assignment that checks
// already-assigned left/up neighbors: no two adjacent same-type wall tiles ever
// share a variant (grid graph is 2-colorable, we have 3 variants — always safe).
function buildVariantGrid(lvl) {
  if (!wallVariants || !wallVariants[1]) return;
  const m = lvl.map, H2 = m.length, W2 = m[0].length;
  const grid = [];
  for (let y = 0; y < H2; y++) {
    grid.push(new Array(W2).fill(-1));
    for (let x = 0; x < W2; x++) {
      const k = m[y][x];
      const vs = wallVariants[k];
      if (!vs || vs.length < 2) continue;
      const n = vs.length;
      // Forbid variants already used by same-type left/up neighbors, then take
      // the first free slot in hash order. ≤2 forbidden of n=3 → always free.
      const forb = new Set();
      if (x > 0 && m[y][x-1] === k && grid[y][x-1] >= 0) forb.add(grid[y][x-1]);
      if (y > 0 && m[y-1][x] === k && grid[y-1][x] >= 0) forb.add(grid[y-1][x]);
      let v = hash2(x, y, k) % n;
      let guard = 0;
      while (forb.has(v) && guard < n) { v = (v + 1) % n; guard++; }
      grid[y][x] = v;
    }
  }
  lvl._vgrid = grid;
}

// Z-buffer for sprite occlusion
let zBuffer = [];

function render() {
  if (!map || !map.length) return;

  const W = canvas.width, H = canvas.height;
  const halfH = H / 2;
  const bob = isMoving ? Math.sin(bobPhase) * 2 : 0;
  const viewY = halfH;

  // One-time caches: soft joint gradient strips (no hard edges anywhere)
  if (!render._jt) {
    const mk = (c0, c1) => {
      const t = document.createElement('canvas'); t.width = 1; t.height = 32;
      const xc = t.getContext('2d');
      const g = xc.createLinearGradient(0, 0, 0, 32);
      g.addColorStop(0, c0); g.addColorStop(1, c1);
      xc.fillStyle = g; xc.fillRect(0, 0, 1, 32);
      return t;
    };
    render._jt = mk('rgba(0,0,0,0.42)', 'rgba(0,0,0,0)'); // fades downward from top
    render._jb = mk('rgba(0,0,0,0)', 'rgba(0,0,0,0.42)'); // fades downward to bottom
    // Faint violet rim strip — laid along wall tops so the wavy organic
    // silhouette reads against the dark even at distance
    const rt = document.createElement('canvas'); rt.width = 1; rt.height = 6;
    const rc = rt.getContext('2d');
    const rg = rc.createLinearGradient(0, 0, 0, 6);
    rg.addColorStop(0, 'rgba(160,105,185,0)');
    rg.addColorStop(0.45, 'rgba(160,105,185,0.7)');
    rg.addColorStop(1, 'rgba(130,90,150,0)');
    rc.fillStyle = rg; rc.fillRect(0, 0, 1, 6);
    render._rim = rt;
  }

  // Sky gradient — dark void, with a faint horizon glow so the organic,
  // staggered wall-top silhouettes read against the backdrop
  const skyGrad = ctx.createLinearGradient(0, 0, 0, viewY);
  skyGrad.addColorStop(0, curPalette.skyTop);
  skyGrad.addColorStop(1, curPalette.skyBot);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, viewY);
  // Faint horizon band just above the horizon line — lifts wall-top
  // silhouettes off the void so the staggered organic skyline reads
  const hz = ctx.createLinearGradient(0, viewY - 26, 0, viewY);
  hz.addColorStop(0, 'rgba(48,26,38,0)');
  hz.addColorStop(1, curPalette.rim + '2b');
  ctx.fillStyle = hz;
  ctx.fillRect(0, viewY - 26, W, 26);

  // Floor gradient — dark organic ground
  const floorGrad = ctx.createLinearGradient(0, viewY, 0, H);
  floorGrad.addColorStop(0, curPalette.floor[0]);
  floorGrad.addColorStop(0.55, curPalette.floor[1]);
  floorGrad.addColorStop(1, curPalette.floor[2]);
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, viewY, W, H - viewY);
  // Faint organic floor mottling — broad slow blotches so the "completely
  // flat featureless plane" reads as uneven living ground instead
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = '#2a1a12';
  for (let mx = 0; mx < W; mx += 6) {
    for (let my = viewY; my < H; my += 6) {
      const nx = Math.sin(mx * 0.013 + my * 0.007 + variantSeed * 0.002) *
                 Math.sin(my * 0.017 - mx * 0.011 + 5.3);
      if (nx > 0.35) {
        const rr = 3 + 3.5 * (nx - 0.35);
        ctx.beginPath();
        ctx.arc(mx, my, rr, 0, PI2);
        ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;

  // Raycast walls
  const numRays = Math.min(W, 480);
  const stripW = W / numRays;
  zBuffer = new Array(numRays);

  for (let i = 0; i < numRays; i++) {
    const rayAngle = player.angle - FOV/2 + (i / numRays) * FOV;
    const rdx = Math.cos(rayAngle), rdy = Math.sin(rayAngle);

    // DDA
    let mapX = Math.floor(player.x), mapY = Math.floor(player.y);
    const ddx = Math.abs(1 / (rdx || 0.00001)), ddy = Math.abs(1 / (rdy || 0.00001));
    let stepX, stepY, sdx, sdy;
    if (rdx < 0) { stepX = -1; sdx = (player.x - mapX) * ddx; }
    else { stepX = 1; sdx = (mapX + 1 - player.x) * ddx; }
    if (rdy < 0) { stepY = -1; sdy = (player.y - mapY) * ddy; }
    else { stepY = 1; sdy = (mapY + 1 - player.y) * ddy; }

    let hit = 0, side = 0, depth = 0;
    while (!hit && depth < MAX_DEPTH) {
      if (sdx < sdy) { sdx += ddx; mapX += stepX; side = 0; }
      else { sdy += ddy; mapY += stepY; side = 1; }
      depth++;
      if (mapY >= 0 && mapY < map.length && mapX >= 0 && mapX < map[0].length)
        hit = map[mapY][mapX];
      else break;
    }

    if (hit > 0) {
      let perpDist;
      if (side === 0) perpDist = (mapX - player.x + (1 - stepX) / 2) / (rdx || 0.00001);
      else perpDist = (mapY - player.y + (1 - stepY) / 2) / (rdy || 0.00001);
      perpDist = Math.max(0.01, perpDist);
      // Fix fisheye
      perpDist *= Math.cos(rayAngle - player.angle);

      zBuffer[i] = perpDist;

      // Door animation: slide texture horizontally, keep full height
      let doorTexOffset = 0;
      if (hit === 2 || hit === 6 || hit === 8) {
        const ds = doorStates[mapX + ',' + mapY];
        if (ds) {
          doorTexOffset = ds.openProgress * TEX_SIZE;
          if (ds.openProgress >= 0.99) { continue; } // fully open, draw nothing
        }
      }

      const wallH = (H / perpDist);
      const organic = (hit === 1 || hit === 3 || hit === 4);
      // Wall-plane coordinate along the face — continuous across a whole
      // straight wall run (side 0: world Y at hit; side 1: world X at hit).
      let wCoord;
      if (side === 0) wCoord = player.y + ((mapX - player.x + (1 - stepX) / 2) / (rdx || 0.00001)) * rdy;
      else wCoord = player.x + ((mapY - player.y + (1 - stepY) / 2) / (rdy || 0.00001)) * rdx;
      // De-boxing lever 3: the wall-top heightline is a CONTINUOUS curve over
      // the wall-plane coordinate (phase shared by every tile in a straight
      // run, so the silhouette waves instead of stepping), plus a small
      // per-tile stagger for inter-tile variety. Walls also grow slight roots
      // down into the floor. Functional tiles — doors (2/6/8), exit sign (5),
      // switch (7) — stay full height so affordances remain crisp.
      const planeCoord = side === 0 ? mapX : mapY;
      const topNoise = Math.sin(wCoord * 1.9 + planeCoord * 1.3 + variantSeed * 0.002) *
                       Math.sin(wCoord * 3.7 - planeCoord * 0.6 + 1.7) *
                       (0.6 + 0.4 * Math.sin(wCoord * 0.53 + planeCoord * 2.1 + 3.9));
      const hScale = organic
        ? 0.88 + 0.025 * (Math.abs(hash2(mapX, mapY, 911)) % 3) + 0.09 * topNoise
        : 1;
      const bottomExt = organic ? 0.035 + 0.035 * Math.sin(wCoord * 2.6 + planeCoord * 0.8 + 4.2) : 0;
      const wallHs = wallH * hScale;
      const drawY = viewY - wallHs / 2;
      const bottomY = viewY + wallHs / 2 + wallH * bottomExt;
      // Darker world: dimmer base shade + faster distance falloff + darker side faces
      const shade = Math.min(1, 1.25 / (perpDist * 0.35 + 0.68));

      // Pick a variant per world tile: adjacent tiles never share the same
      // variant, so repeating patterns never line up across neighboring walls.
      let texKey = hit;
      if (hit === 7) {
        const lvl = LEVELS[currentLevel];
        let isActivated = false;
        if (lvl && lvl.switches) {
          for (let si = 0; si < lvl.switches.length; si++) {
            if (lvl.switches[si].x === mapX && lvl.switches[si].y === mapY) {
              isActivated = switchStates[si] && switchStates[si].activated;
              break;
            }
          }
        }
        texKey = isActivated ? '7a' : 7;
      }
      let tex;
      const vset = wallVariants[texKey];
      if (vset && vset.length > 1) {
        // O(1) lookup into the precomputed anti-tile variant grid
        const vg = LEVELS[currentLevel]._vgrid;
        const vi = vg ? vg[mapY][mapX] : 0;
        tex = vset[vi >= 0 ? vi : 0];
      } else {
        tex = wallTextures[texKey];
      }
      if (tex) {
        // Calculate texture X coordinate (exact hit point on wall face)
        let wallX;
        if (side === 0) wallX = player.y + ((mapX - player.x + (1 - stepX) / 2) / (rdx || 0.00001)) * rdy;
        else wallX = player.x + ((mapY - player.y + (1 - stepY) / 2) / (rdy || 0.00001)) * rdx;
        wallX = wallX - Math.floor(wallX);
        if (side === 0 && rdx > 0) wallX = 1 - wallX;
        if (side === 0 && rdx < 0) wallX = 1 - wallX;
        if (side === 1 && rdy < 0) wallX = 1 - wallX;
        if (side === 1 && rdy > 0) wallX = 1 - wallX;
        // Apply door slide offset to texture X — show dark gap behind sliding door
        let texX = Math.floor(wallX * TEX_SIZE) - Math.floor(doorTexOffset);
        // De-boxing lever 1b: shorter organic walls expose dark void above them,
        // and get a soft dark cap band where flesh meets void — reads as a
        // rounded membrane top rather than a sawn-off box edge.
        if (hScale < 1) {
          ctx.fillStyle = '#040206';
          ctx.fillRect(i * stripW, viewY - wallHs / 2, stripW + 0.5, Math.max(1, (wallH - wallHs) * 0.55));
        }
        if (texX < 0 || texX >= TEX_SIZE) {
          // Door has slid past this column — draw dark gap (interior behind door)
          ctx.fillStyle = '#050505';
          ctx.fillRect(i * stripW, drawY, stripW + 0.5, bottomY - drawY);
        } else {
          // De-boxing lever 2 (v2): brightness swells in **world space** — each
          // tile bulges from its global position, not its screen-x — so the
          // swell peaks mid-tile and both tiles around a seam stay dimmer-ish
          // or brighter-ish TOGETHER. No double-dark panel seams. Exit/switch
          // stay unbowed; affordances stay crisp.
          const wx = mapX + wallX, wy = mapY + wallX;
          const swell = (hit === 5 || hit === 7 || hit === 9) ? 1 :
            1 + 0.16 * Math.sin(wx * 2.4 + wy * 1.7 + variantSeed * 0.003) * Math.sin(wy * 1.9 - wx * 1.3 + variantSeed * 0.007);
          let a = Math.max(0.08, shade * swell);
          if (side === 1) a = Math.max(0.08, shade * 0.68 * swell);
          if (hit === 2 || hit === 6 || hit === 8) a = Math.min(1, a * 1.5); // doors glow faintly
          if (hit === 5) a = Math.min(1, shade * 2.2); // exit sign stays readable in the dark
          ctx.globalAlpha = a;
          // Column overlap scales with distance: crisp close up, smeared into
          // irregular organic streaks on distant walls (kills picket striping)
          ctx.drawImage(tex, texX, 0, 1, TEX_SIZE, i * stripW, drawY, stripW + (perpDist > 3 ? 1.2 : 0.25), bottomY - drawY);
          ctx.globalAlpha = 1;
        }
      } else {
        // Fallback: solid color
        const colors = WALL_COLORS[hit] || WALL_COLORS[1];
        ctx.fillStyle = side === 0 ? colors.light : colors.dark;
        ctx.globalAlpha = shade;
        ctx.fillRect(i * stripW, viewY - wallH/2, stripW + 0.5, wallH);
        ctx.globalAlpha = 1;
      }

      // Organic joint seams: soft gradient bands whose depth undulates per
      // ray-column — curved wall↔ceiling and wall↔floor seams, no hard lines.
      const seamT = Math.max(2, 4 + Math.sin(i * 0.5 + mapX * 2.3 + mapY * 1.7 + variantSeed * 0.01) * 2);
      const seamB = Math.max(2, 4 + Math.sin(i * 0.62 + mapX * 1.8 + mapY * 2.6 + variantSeed * 0.013) * 2.2);
      // Rim light along the wall-top edge — a faint violet lip that keeps the
      // organic silhouette readable even in deep darkness / at distance.
      const rimA = 0.09 + 0.16 * Math.max(0, Math.min(1, 1.6 - perpDist * 0.22));
      ctx.globalAlpha = rimA * (organic ? 1 : 0.55);
      ctx.drawImage(render._rim, 0, 0, 1, 6, i * stripW, drawY - 1, stripW + 0.5, 6);
      ctx.globalAlpha = 1;
      ctx.drawImage(render._jt, 0, 0, 1, 32, i * stripW, drawY, stripW + 0.5, seamT);
      ctx.drawImage(render._jb, 0, 0, 1, 32, i * stripW, bottomY - seamB, stripW + 0.5, seamB);
      // Ceiling danglers — hanging membrane anchored to THIS column's true
      // wall top (drawY), drawn inside the ray loop so nearer walls paint
      // over farther danglers automatically. Clump/length derive from wCoord
      // (world position along the face), so clusters are stable while you
      // move and turn — no horizon ghosts, no screen-space swimming. Only
      // organic walls; doors/switches/exit/bus keep crisp edges.
      if (organic && window.DANGLERS_ON !== false) {
        const clump = Math.sin(wCoord * 1.7 + planeCoord * 2.9 + variantSeed * 0.003) *
                      Math.sin(wCoord * 0.71 + planeCoord * 0.44 + 2.2);
        if (clump > 0.08) {
          const jag = 0.65 + 0.35 * Math.sin(wCoord * 5.3 + planeCoord * 1.6 + variantSeed * 0.004);
          const dl = Math.min(wallHs * 0.16, wallHs * (0.045 + 0.1 * Math.min(1, clump)) * jag);
          ctx.fillStyle = 'rgba(6,3,9,0.72)';
          ctx.beginPath();
          ctx.moveTo(i * stripW - 0.3, drawY + 1);
          ctx.quadraticCurveTo(i * stripW + stripW * 0.25, drawY + 1 + dl * 0.6, i * stripW + stripW * 0.5, drawY + 1 + dl);
          ctx.quadraticCurveTo(i * stripW + stripW * 0.75, drawY + 1 + dl * 0.6, i * stripW + stripW + 0.3, drawY + 1);
          ctx.closePath();
          ctx.fill();
        }
      }
    } else {
      zBuffer[i] = MAX_DEPTH;
      // Escape ray — no wall up to MAX_DEPTH. In the ending cinematic's
      // breached depot this is the maw: paint void black ONLY within the
      // breached wall's own silhouette at the breach plane — inset 50px
      // per side, corners rounded (r=50, clamped like CSS border-radius)
      // so the opening reads as a bounded, soft-cornered gap in the wall:
      // sky above, floor below, never a stripe.
      if (endingActive && rdy > 0.0001 && player.y < 29) {
        const tC = (29.0 - player.y) / rdy;              // cross breach plane
        const mxF = player.x + tC * rdx;                 // world x at plane
        if (mxF >= 12.999 && mxF <= 20.001) {            // within breach span
          const perpW = tC * Math.cos(rayAngle - player.angle);
          if (perpW > 0.05) {
            const focalLen = (W / 2) / Math.tan(FOV / 2);
            const sxOf = ax => W / 2 + focalLen *
              Math.tan(Math.atan2(29.0 - player.y, ax - player.x) - player.angle);
            const sA = sxOf(13), sB = sxOf(20);          // edge screen x's
            // NB: this projection mirrors world-x on screen (west → right),
            // so min/max before insetting 50px per side
            const L = Math.min(sA, sB) + 50, R = Math.max(sA, sB) - 50;
            const apH = H / perpW;                       // wall slice height
            const rC = Math.min(50, (R - L) / 2, apH / 2);
            const ccx = i * stripW + stripW / 2;
            if (ccx > L && ccx < R && rC > 0) {
              let cut = 0;                               // corner-circle inset
              const dl = (L + rC) - ccx;
              if (dl > 0) cut = rC - Math.sqrt(Math.max(0, rC * rC - dl * dl));
              const dr = ccx - (R - rC);
              if (dr > 0) cut = Math.max(cut, rC - Math.sqrt(Math.max(0, rC * rC - dr * dr)));
              const topA = viewY - apH / 2 + cut, botA = viewY + apH / 2 - cut;
              if (botA - topA > 0.5) {
                ctx.fillStyle = '#000';
                ctx.fillRect(i * stripW, topA, stripW + 0.6, botA - topA);
              }
            }
          }
        }
      }
    }
  }

  // Render enemies (textured sprites with animation) — dead ones stay as corpses
  const visibleEnemies = [];
  for (const e of enemies) {
    const edx = e.x - player.x, edy = e.y - player.y;
    const dist = Math.hypot(edx, edy);
    let angle = Math.atan2(edy, edx) - player.angle;
    while (angle > PI) angle -= PI2;
    while (angle < -PI) angle += PI2;
    if (Math.abs(angle) > FOV/2 + 0.2) continue;
    // chamber sleepers don't render until their secret is opened
    if (e.secret && !secretsRevealed) continue;
    // Don't cull with wallBetween — the per-column z-buffer handles partial occlusion
    visibleEnemies.push({ ...e, dist, angle, perpDist: dist * Math.cos(angle) });
  }
  visibleEnemies.sort((a, b) => b.perpDist - a.perpDist);

  for (const e of visibleEnemies) {
    const perpDist = Math.max(0.1, e.perpDist);
    // Proper perspective: project angle onto screen using focal length
    const focalLen = (W / 2) / Math.tan(FOV / 2);
    const screenX = W / 2 + focalLen * Math.tan(e.angle);
    const dead = !e.alive;
    const dying = dead && !e.deathDone; // animating: 3 crumple frames + blood pool growth
    // Floor line for this distance — corpses sit ON the floor, never above it
    const floorY = halfH + (H / perpDist) * 0.5;
    const deathFrame = dying ? Math.min(2, Math.floor((1 - e.deathTimer / 45) * 3)) : 2;
    // Death frames carry the crumple; box only eases 100%->70% for a soft impact
    const deadMult = dying ? (0.7 + 0.3 * (e.deathTimer / 45)) : 0.7;
    const spriteH = (H / perpDist) * ENEMY_TYPES[e.type].size * 2.5 * (dead ? deadMult : 1);
    const spriteW = spriteH * (SPRITE_W / SPRITE_H) * (dead ? 1.5 : 1);
    const spriteTop = dead ? floorY - spriteH : halfH - spriteH * 0.55;

    // Full opacity for enemies — no distance fading, slight darkening only when very far
    const shade = perpDist > 8 ? Math.max(0.7, 1 - (perpDist - 8) * 0.05) : 1;

    // Get sprite sheet frame — dead enemies use dedicated crumple frames
    const sprites = enemySprites[e.type];
    let spriteCanvas;
    if (dead) {
      spriteCanvas = sprites?.death?.[deathFrame];
    } else {
      const animState = e.animState || 'walk';
      const animFrame = e.animFrame || 0;
      const stateSprites = sprites?.[animState] || sprites?.walk;
      const frameIndex = Math.min(animFrame, (stateSprites?.length || 1) - 1);
      spriteCanvas = stateSprites?.[frameIndex];
    }

    if (spriteCanvas) {
      // Per-column z-buffer rendering: draw each visible column separately
      const leftX = screenX - spriteW / 2;
      const numCols = Math.ceil(spriteW);
      // Blood pool params: grows during death anim, z-clipped per column (never through walls)
      const poolProgress = dead ? (dying ? 1 - e.deathTimer / 45 : 1) : 0;
      const poolHalf = spriteW * 0.3 * poolProgress;
      for (let col = 0; col < numCols; col++) {
        const screenColX = leftX + col;
        const stripIdx = Math.floor(screenColX / stripW);
        if (stripIdx < 0 || stripIdx >= numRays) continue;
        // Skip columns where a wall is closer
        if (zBuffer[stripIdx] < perpDist - 0.05) continue;
        // Source texture X for this sprite column
        const texCol = Math.floor((col / spriteW) * SPRITE_W);
        if (texCol < 0 || texCol >= SPRITE_W) continue;

        if (poolHalf > 1 && Math.abs(screenColX + 0.5 - screenX) < poolHalf) {
          // This column is over the pool — draw the ellipse slice (clipped by z-buffer above)
          const t = 1 - Math.abs(screenColX + 0.5 - screenX) / poolHalf;
          const ph = Math.max(1.5, poolHalf * 0.45 * Math.sqrt(t));
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = '#570808';
          ctx.fillRect(screenColX, floorY - ph * 0.55, 1, ph);
          ctx.globalAlpha = 1;
        }
        if (dead) {
          // Crumpled, blood-washed death frame; final frame persists as the corpse
          ctx.globalAlpha = shade;
          ctx.drawImage(spriteCanvas, texCol, 0, 1, SPRITE_H, screenColX, spriteTop, 1, spriteH);
        } else if (e.hitTimer > 0) {
          // Flash: draw sprite tinted white for this column
          const tc = document.createElement('canvas');
          tc.width = 1; tc.height = SPRITE_H;
          const tctx = tc.getContext('2d');
          tctx.fillStyle = '#fff';
          tctx.fillRect(0, 0, 1, SPRITE_H);
          tctx.globalCompositeOperation = 'destination-in';
          tctx.drawImage(spriteCanvas, texCol, 0, 1, SPRITE_H, 0, 0, 1, SPRITE_H);
          tctx.globalCompositeOperation = 'source-over';
          ctx.globalAlpha = 0.7;
          ctx.drawImage(tc, screenColX, spriteTop, 1, spriteH);
          ctx.globalAlpha = shade * 0.5;
          ctx.drawImage(spriteCanvas, texCol, 0, 1, SPRITE_H, screenColX, spriteTop, 1, spriteH);
        } else {
          ctx.globalAlpha = shade;
          ctx.drawImage(spriteCanvas, texCol, 0, 1, SPRITE_H, screenColX, spriteTop, 1, spriteH);
        }
      }
    } else {
      // Fallback: colored shape
      if (dead) {
        // Corpse fallback: crumpled dark-red heap + z-clipped pool slices
        const leftX2 = screenX - spriteW / 2;
        const cols2 = Math.ceil(spriteW);
        for (let col = 0; col < cols2; col++) {
          const sx2 = leftX2 + col;
          const si2 = Math.floor(sx2 / stripW);
          if (si2 < 0 || si2 >= numRays) continue;
          if (zBuffer[si2] < perpDist - 0.05) continue;
          if (poolHalf > 1 && Math.abs(sx2 + 0.5 - screenX) < poolHalf) {
            const t2 = 1 - Math.abs(sx2 + 0.5 - screenX) / poolHalf;
            const ph2 = Math.max(1.5, poolHalf * 0.45 * Math.sqrt(t2));
            ctx.globalAlpha = 0.85; ctx.fillStyle = '#570808';
            ctx.fillRect(sx2, floorY - ph2 * 0.55, 1, ph2);
          }
          ctx.globalAlpha = shade; ctx.fillStyle = '#5a0f0f';
          ctx.fillRect(sx2, floorY - spriteH * ((deathFrame + 2) / 5), 1, spriteH * ((deathFrame + 2) / 5));
        }
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = e.hitTimer > 0 ? '#fff' : ENEMY_TYPES[e.type].color;
        ctx.globalAlpha = shade;
        ctx.fillRect(screenX - spriteW*0.35, spriteTop + spriteH*0.25, spriteW*0.7, spriteH*0.5);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Render pickups (bobbing sprites, after enemies before weapon)
  const visiblePickups = [];
  for (const p of pickups) {
    if (p.taken) continue;
    const pdx = p.x - player.x, pdy = p.y - player.y;
    const pdist = Math.hypot(pdx, pdy);
    let pangle = Math.atan2(pdy, pdx) - player.angle;
    while (pangle > PI) pangle -= PI2;
    while (pangle < -PI) pangle += PI2;
    if (Math.abs(pangle) > FOV/2 + 0.2) continue;
    if (wallBetween(player.x, player.y, p.x, p.y)) continue;
    visiblePickups.push({ p, dist: pdist, angle: pangle, perpDist: pdist * Math.cos(pangle) });
  }
  visiblePickups.sort((a, b) => b.perpDist - a.perpDist);

  for (const vp of visiblePickups) {
    const p = vp.p;
    const perpDist = Math.max(0.1, vp.perpDist);
    const focalLen = (W / 2) / Math.tan(FOV / 2);
    const screenX = W / 2 + focalLen * Math.tan(vp.angle);
    const pSpriteH = (H / perpDist) * 0.4; // smaller than enemies
    const pSpriteW = pSpriteH;
    // Bobbing effect
    const bobY = Math.sin(bobPhase * 0.5 + p.x * 3 + p.y * 2) * pSpriteH * 0.1;
    const spriteTop = halfH - pSpriteH / 2 + bobY;
    const shade = Math.min(1, 1.2 / (perpDist * 0.3 + 0.6));
    let pSprite = pickupSprites[p.type];
    if (p.type === 'weapon') {
      const wi = WEAPONS.findIndex(w => w.name === p.weapon);
      pSprite = wi >= 0 ? weaponPickupSprites[wi] : null;
    }
    if (!pSprite) continue;

    // Per-column z-buffer rendering for pickups
    const leftX = screenX - pSpriteW / 2;
    const numCols = Math.ceil(pSpriteW);
    for (let col = 0; col < numCols; col++) {
      const screenColX = leftX + col;
      const stripIdx = Math.floor(screenColX / stripW);
      if (stripIdx < 0 || stripIdx >= numRays) continue;
      if (zBuffer[stripIdx] < perpDist - 0.3) continue;
      const texCol = Math.floor((col / pSpriteW) * pSprite.width);
      if (texCol < 0 || texCol >= pSprite.width) continue;
      ctx.globalAlpha = shade;
      ctx.drawImage(pSprite, texCol, 0, 1, pSprite.height, screenColX, spriteTop, 1, pSpriteH);
    }
    ctx.globalAlpha = 1;
  }

  // Weapon (pre-rendered sprite with recoil + muzzle flash)
  // Suppressed on the title screen bus snapshot (window._hideGun)
  const sprite = (!window._hideGun) ? weaponSprites[currentWeapon] : null;
  if (sprite) {
    // Scale sprite to ~38% of screen height
    const scale = (H * 0.38) / sprite.height;
    const drawW = sprite.width * scale;
    const drawH = sprite.height * scale;
    // Position: bottom-center, offset by bob and recoil
    const recoil = recoilOffset * 20;
    const bobX = isMoving ? Math.sin(bobPhase * 0.5) * 3 : 0;
    const bobY = isMoving ? Math.abs(Math.sin(bobPhase)) * 3 : 0;
    const gunX = W / 2 - drawW / 2 + bobX;
    const gunY = H - drawH + recoil * 0.5 - bobY;
    ctx.drawImage(sprite, gunX, gunY, drawW, drawH);

    // Muzzle flash (at barrel tip — top center of sprite)
    if (recoilOffset > 0.5) {
      const flashX = gunX + drawW / 2;
      const flashY = gunY + drawH * 0.08;
      const flashSize = 16 + recoilOffset * 22;
      ctx.globalAlpha = 0.9 * recoilOffset;
      ctx.fillStyle = '#ff0';
      ctx.beginPath(); ctx.arc(flashX, flashY, flashSize, 0, PI2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(flashX, flashY, flashSize * 0.45, 0, PI2); ctx.fill();
      // Spike rays
      ctx.fillStyle = 'rgba(255,220,0,0.6)';
      for (let r = 0; r < 6; r++) {
        const a = r * PI / 3;
        const len = flashSize * 1.4 * recoilOffset;
        ctx.beginPath();
        ctx.moveTo(flashX, flashY);
        ctx.lineTo(flashX + Math.cos(a) * len, flashY + Math.sin(a) * len);
        ctx.lineTo(flashX + Math.cos(a + 0.15) * len * 0.4, flashY + Math.sin(a + 0.15) * len * 0.4);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Damage flash
  const flash = document.getElementById('damage-flash');
  flash.style.background = damageTimer > 0 ? `rgba(255,0,0,${damageTimer * 0.06})` : 'rgba(255,0,0,0)';

  // Minimap (toggle with M — off by default)
  mmCanvas.style.display = window.MINIMAP_ON ? 'block' : 'none';
  document.getElementById('btn-map').style.display = window.MINIMAP_ON ? 'none' : 'flex';
  if (window.MINIMAP_ON) renderMinimap();
}

function renderMinimap() {
  const S = 7;
  const mmW = 140, mmH = 140;
  mmCtx.fillStyle = 'rgba(0,0,0,0.8)';
  mmCtx.fillRect(0, 0, mmW, mmH);

  const cx = Math.floor(player.x), cy = Math.floor(player.y);
  const viewRange = 10;

  for (let dy = -viewRange; dy <= viewRange; dy++) {
    for (let dx = -viewRange; dx <= viewRange; dx++) {
      const mx = cx + dx, my = cy + dy;
      if (my < 0 || my >= map.length || mx < 0 || mx >= map[0].length) continue;
      const tile = map[my][mx];
      const sx = mmW/2 + dx * S, sy = mmH/2 + dy * S;
      if (tile === 0) mmCtx.fillStyle = '#181818';
      else if (tile === 5) mmCtx.fillStyle = '#0ff';
      else mmCtx.fillStyle = WALL_COLORS[tile]?.dark || '#444';
      mmCtx.fillRect(sx - S/2, sy - S/2, S, S);
    }
  }

  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.secret && !secretsRevealed) continue; // hidden until the secret opens
    const ex = mmW/2 + (e.x - player.x) * S;
    const ey = mmH/2 + (e.y - player.y) * S;
    if (ex < 0 || ex > mmW || ey < 0 || ey > mmH) continue;
    mmCtx.fillStyle = ENEMY_TYPES[e.type].color;
    mmCtx.beginPath();
    mmCtx.arc(ex, ey, 2.5, 0, PI2);
    mmCtx.fill();
  }

  // Pickups on minimap
  for (const p of pickups) {
    if (p.taken) continue;
    if (p.x < 0 || p.y < 0) continue;
    const inSecret = LEVELS[currentLevel]._secretRects ?
      LEVELS[currentLevel]._secretRects.some(r => p.x >= r[0] && p.x < r[0]+r[2] && p.y >= r[1] && p.y < r[1]+r[3]) : false;
    if (inSecret && !secretsRevealed) continue; // hidden until the secret opens
    const px = mmW/2 + (p.x - player.x) * S;
    const py = mmH/2 + (p.y - player.y) * S;
    if (px < 0 || px > mmW || py < 0 || py > mmH) continue;
    mmCtx.fillStyle = p.type === 'health' ? '#0f0' : (p.type === 'weapon' ? '#0ff' : '#ff0');
    mmCtx.fillRect(px - 2, py - 2, 4, 4);
  }

  mmCtx.fillStyle = '#0f0';
  mmCtx.beginPath();
  mmCtx.arc(mmW/2, mmH/2, 3, 0, PI2);
  mmCtx.fill();
  mmCtx.strokeStyle = '#0f0';
  mmCtx.lineWidth = 1.5;
  mmCtx.beginPath();
  mmCtx.moveTo(mmW/2, mmH/2);
  mmCtx.lineTo(mmW/2 + Math.cos(player.angle) * 10, mmH/2 + Math.sin(player.angle) * 10);
  mmCtx.stroke();
}

// ---- GAME LOOP ----
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

gameLoop();

// ---- TITLE SCREEN BUS SNAPSHOT ----
// Render a live first-person view of the L10 bus bay onto the title screen
// using the game's own renderer. Temporarily swap state/canvas, paint, restore.
(function renderTitleBus() {
  const snapCanvas = document.getElementById('title-bus');
  if (!snapCanvas) return;
  try {
    currentLevel = 9;
    initLevel(9);
    // Clear the stage: snapshot shows just the bus bay
    enemies = []; pickups = [];
    // Paint over the passenger door for the title shot only (snapshot works on
    // initLevel's map copy) so the hull reads as one continuous body.
    map[17][16] = 9;
    // Corner shot: camera SW of the near vertex (13,17), aimed at the
    // corner so the left face (x13 side) and right face (y17 end, with the
    // red accent) meet just left of frame center — matches the hero shot.
    player.x = 13.8; player.y = 19.0; player.angle = -1.9;
    const savedFOV = FOV; FOV = 74 * DEG;
    const realW = canvas.width, realH = canvas.height;
    // Render at snapshot size on the main canvas, then copy pixels over
    canvas.width = snapCanvas.width; canvas.height = snapCanvas.height;
    window._hideGun = true;   // no viewmodel in the title shot
    render();
    window._hideGun = false;
    snapCanvas.getContext('2d').drawImage(canvas, 0, 0);
    FOV = savedFOV;
    canvas.width = realW; canvas.height = realH;
    resize();
    // Leave the game parked on L10 init state; startGame() re-inits from level 1
    currentLevel = 0;
  } catch (err) {
    console.warn('title snapshot failed', err);
  }
})();

function endingAudio() {
  try {
    const AC = new (window.AudioContext || window.webkitAudioContext)();
    const master = AC.createGain(); master.gain.value = 0.13; master.connect(AC.destination);
    // low engine hum
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 46;
    const of = AC.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 150;
    const og = AC.createGain(); og.gain.value = 0.5;
    o.connect(of); of.connect(og); og.connect(master); o.start();
    // rolling / road noise
    const len = AC.sampleRate * 2;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.03 * w) / 1.03; d[i] = last * 3.2; }
    const ns = AC.createBufferSource(); ns.buffer = buf; ns.loop = true;
    const nf = AC.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 240;
    ns.connect(nf); nf.connect(master); ns.start();

    // rev-up whine as the bus charges the wall (ramps 5s, cuts at impact)
    endingAudio.rev = () => {
      const o2 = AC.createOscillator(); o2.type = 'sawtooth';
      const f2 = AC.createBiquadFilter(); f2.type = 'lowpass';
      const g2 = AC.createGain(); g2.gain.value = 0.0;
      o2.connect(f2); f2.connect(g2); g2.connect(master);
      const now = AC.currentTime;
      o2.frequency.setValueAtTime(52, now);
      o2.frequency.exponentialRampToValueAtTime(210, now + 2.9);
      f2.frequency.setValueAtTime(160, now);
      f2.frequency.exponentialRampToValueAtTime(900, now + 2.9);
      g2.gain.setValueAtTime(0.001, now);
      g2.gain.exponentialRampToValueAtTime(0.6, now + 2.6);
      g2.gain.setValueAtTime(0.6, now + 2.9);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 3.05);
      o2.start(now); o2.stop(now + 3.1);
      o2.frequency.cancelScheduledValues(now + 3.0);
    };

    // detonation: sub drop + noise burst + metallic shrapnel ping
    endingAudio.boom = () => {
      const now = AC.currentTime;
      // sub drop
      const o3 = AC.createOscillator(); o3.type = 'sine';
      const g3 = AC.createGain();
      o3.frequency.setValueAtTime(95, now);
      o3.frequency.exponentialRampToValueAtTime(24, now + 0.7);
      g3.gain.setValueAtTime(0.9, now);
      g3.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
      o3.connect(g3); g3.connect(master); o3.start(now); o3.stop(now + 1.2);
      // crack
      const nb = AC.createBuffer(1, AC.sampleRate * 1.4, AC.sampleRate);
      const nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) {
        nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 2.6);
      }
      const ns2 = AC.createBufferSource(); ns2.buffer = nb;
      const bf = AC.createBiquadFilter(); bf.type = 'lowpass';
      bf.frequency.setValueAtTime(3200, now);
      bf.frequency.exponentialRampToValueAtTime(160, now + 1.1);
      const ng = AC.createGain(); ng.gain.setValueAtTime(1.0, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
      ns2.connect(bf); bf.connect(ng); ng.connect(master); ns2.start(now);
      // metal ring-outs
      for (const [f, v, dur] of [[1730, 0.10, 1.6], [2410, 0.07, 1.2], [860, 0.12, 2.0]]) {
        const o4 = AC.createOscillator(); o4.type = 'triangle'; o4.frequency.value = f;
        const g4 = AC.createGain();
        g4.gain.setValueAtTime(v, now + 0.02);
        g4.gain.exponentialRampToValueAtTime(0.001, now + dur);
        o4.connect(g4); g4.connect(master); o4.start(now + 0.02); o4.stop(now + dur + 0.05);
      }
    };

    endingAudio.ctx = AC;
    endingAudio.master = master;
  } catch (err) { /* audio optional */ }
}

function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}


// ============================================================
// ENDING CINEMATIC (engine-mode) — seat press → the game's own
// raycaster renders a directed shot: chase-cam behind a bus
// billboard in the depot, ignition, rev-up, charge, and the bus
// CRASHES THROUGH THE DEPOT WALL (real tile mutation → real
// lighting/occlusion), rubble + embers + dust, then the text,
// freeze until tapped → reload to title.
// ============================================================
let endingActive = false;

function startEnding() {
  if (endingActive) return;
  endingActive = true;
  state = 'ended';
  firing = false;
  if (document.pointerLockElement) document.exitPointerLock();
  document.getElementById('hud').style.display = 'none';
  document.getElementById('mobile-controls').style.display = 'none';
  document.getElementById('win-screen').style.display = 'none';
  const overlay = document.getElementById('ending');
  const cnv = document.getElementById('ending-canvas');
  cnv.width = window.innerWidth; cnv.height = window.innerHeight;
  // Fade to black first (overlay is opaque), then the engine shot
  // fades back in from black under the same overlay.
  // Engine mode: the overlay itself is transparent (the live raycaster
  // shows through); all fades ride the #ending-black child layer.
  overlay.style.display = 'block';
  overlay.style.background = 'transparent';
  overlay.style.opacity = '1';
  // Flush layout before touching the black layer: it was display:none a
  // tick ago, so an immediate opacity bump would SNAP to black instead of
  // transitioning. After the flush, 0→1 rides the CSS 1.15s ease — a real
  // game fade-out before the engine shot takes over.
  void document.getElementById('ending-black').offsetWidth;
  document.getElementById('ending-black').style.opacity = '1';
  endingAudio();
  runEndingCinematic(cnv);
}

function runEndingCinematic(cnv) {
  const x = cnv.getContext('2d');
  const W = cnv.width, H = cnv.height;
  const rng = mulberry32(4510);

  // Stage the world for the shot: fresh L10 map, empty floor where the
  // bus hull was (the bus becomes a billboard), no monsters/pickups.
  enemies = []; pickups = [];
  for (let yy = 13; yy <= 17; yy++)
    for (let xx = 13; xx <= 19; xx++) map[yy][xx] = 0;
  doorStates = {}; switchStates = [];

  // Camera + bus rig
  const BX = 16.5;                 // bus lane x (bus drives +y)
  window.FOV = 78 * DEG;
  window._hideGun = true;
  const cam = { x: 16.5, y: 12.8 };
  const bus = { y: 14.6, v: 0 };
  const CRASH_Z = 29.55;           // wall plane (row 30) minus half bus
  const IGN = 700, REV = 1800, DRIVE = 2100, CRASH = 5950,
        TEXT = 9800, FREEZE = 12800;

  let raf = 0, startTs = 0, frozen = false, boomed = false,
      revved = false, textShown = false, seekT = -1, holdT = -1;
  const chunks = [], embers = [], dust = [];
  let smokeClock = 0; // post-crash engine smoke pump

  const overlay = document.getElementById('ending');
  const blackL = document.getElementById('ending-black');
  const flashL = document.getElementById('ending-flash');
  // tap anywhere (after freeze) → reload to the title screen (?level=
  // param must be stripped or the reload deep-links straight back in)
  overlay.addEventListener('pointerdown', () => {
    if (frozen) {
      try { endingAudio.ctx && endingAudio.ctx.close(); } catch (e) {}
      location.href = location.origin + location.pathname;
    }
  });

  function freeze() {
    frozen = true;
    cancelAnimationFrame(raf);
    overlay.classList.add('tap');
    try { endingAudio.ctx && endingAudio.ctx.suspend(); } catch (e) {}
  }

  function easeInCubic(q) { return q * q * q; }

  function busState(t) {
    let z = bus.y, moving = false;
    if (t >= DRIVE && t < CRASH) {
      const q = Math.min(1, (t - DRIVE) / (CRASH - DRIVE));
      z = bus.y + (CRASH_Z - bus.y) * easeInCubic(q);
      moving = true;
    } else if (t >= CRASH) {
      // swallowed by the maw: glides in-deep, settles, then drops like the
      // floor gave way — tail lights sink last (drawn additively, still lit)
      const q = Math.min(1, (t - CRASH) / 2600);
      z = CRASH_Z + (3.0 * q * (1.55 - q * 0.55)); // glide deep: +2.5 net
      moving = q < 0.95;
    }
    // recoil bounce at impact
    let rec = 0;
    if (t > CRASH && t < CRASH + 380) rec = Math.sin((t - CRASH) / 380 * Math.PI) * 0.045;
    const shx = (t > IGN && t < IGN + 800)
      ? Math.sin(t * 0.055) * 0.02 * (1 - (t - IGN) / 800) : 0;
    return { z: z - rec, x: BX + shx, moving };
  }

  // ---- world-space billboard sprite with per-column z clipping ----
  function drawWorldSprite(img, wx, wy, hscale, alpha, additive) {
    const dx = wx - player.x, dy = wy - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.12 || dist > MAX_DEPTH) return;
    let ang = Math.atan2(dy, dx) - player.angle;
    while (ang > Math.PI) ang -= PI2;
    while (ang < -Math.PI) ang += PI2;
    if (Math.abs(ang) > FOV / 2 + 0.4) return;
    const perp = dist * Math.cos(ang);
    const focalLen = (W / 2) / Math.tan(FOV / 2);
    const sx = W / 2 + focalLen * Math.tan(ang);
    const sh = (H / perp) * hscale;
    const sw = sh * (img.width / img.height);
    const floorY = H / 2 + (H / perp) * 0.5;
    const top = floorY - sh;
    const left = sx - sw / 2;
    const numRays = zBuffer.length;
    const stripW = W / numRays;
    if (additive) x.globalCompositeOperation = 'lighter';
    x.globalAlpha = alpha;
    const cols = Math.ceil(sw);
    for (let c = 0; c < cols; c++) {
      const scx = left + c;
      const si = Math.floor(scx / stripW);
      if (si < 0 || si >= numRays) continue;
      if (zBuffer[si] < perp - 0.05) continue;   // wall occludes
      const texCol = Math.floor((c / sw) * img.width);
      if (texCol < 0 || texCol >= img.width) continue;
      x.drawImage(img, texCol, 0, 1, img.height, scx, top, 1.01, sh);
    }
    x.globalAlpha = 1;
    if (additive) x.globalCompositeOperation = 'source-over';
  }

  function project(wx, wy) {
    const dx = wx - player.x, dy = wy - player.y;
    const dist = Math.hypot(dx, dy);
    let ang = Math.atan2(dy, dx) - player.angle;
    while (ang > Math.PI) ang -= PI2;
    while (ang < -Math.PI) ang += PI2;
    const perp = dist * Math.cos(ang);
    const focalLen = (W / 2) / Math.tan(FOV / 2);
    return { sx: W / 2 + focalLen * Math.tan(ang), perp, vis: Math.abs(ang) < FOV / 2 + 0.3 && perp > 0.2 };
  }

  // perpendicular distance to the breached wall face (row 29.8), safe default
  function gpPerpSafe() {
    try { const q = project(BX, 29.8); return (q.vis && q.perp > 0.2) ? q.perp : 10; }
    catch (e) { return 10; }
  }

  // ---- procedural bus sprite (rear view) + rubble + ember ----
  const busImg = (() => {
    const b = document.createElement('canvas'); b.width = 232; b.height = 204;
    const bx = b.getContext('2d');
    const w = 232, h = 172, ox = 0, r = 26;
    // body
    const grad = bx.createLinearGradient(0, 32, 0, h);
    grad.addColorStop(0, '#efd94f'); grad.addColorStop(0.6, '#d9c63e'); grad.addColorStop(1, '#8f7c1e');
    bx.fillStyle = grad;
    bx.beginPath();
    bx.moveTo(ox, h); bx.lineTo(ox, 32 + r);
    bx.quadraticCurveTo(ox, 32, ox + r, 32);
    bx.lineTo(ox + w - r, 32); bx.quadraticCurveTo(ox + w, 32, ox + w, 32 + r);
    bx.lineTo(ox + w, h); bx.closePath(); bx.fill();
    // black mid stripe
    bx.fillStyle = '#1c1a10';
    bx.fillRect(ox, h - 96, w, 14);
    // window band
    bx.fillStyle = '#0b0e13';
    bx.fillRect(ox + 16, 48, w - 32, 52);
    // sheen
    bx.globalAlpha = 0.12; bx.fillStyle = '#bcd2ff';
    bx.fillRect(ox + 26, 52, 52, 20); bx.globalAlpha = 1;
    // CITY 45
    bx.fillStyle = '#675a12';
    bx.font = "bold 26px 'Courier New', monospace"; bx.textAlign = 'center';
    bx.fillText('CITY 45', w / 2, h - 48);
    // rivets
    bx.fillStyle = 'rgba(70,60,14,0.8)';
    for (let ry = 120; ry < h - 6; ry += 16)
      for (let rx = 14; rx < w; rx += 36) bx.fillRect(rx, ry, 3, 3);
    // tail light housings
    for (const lx of [18, w - 44]) {
      bx.fillStyle = '#3a0d0d';
      bx.beginPath(); bx.arc(lx + 13, h - 96, 13, 0, PI2); bx.fill();
      bx.fillStyle = '#ff2b1e';
      bx.beginPath(); bx.arc(lx + 13, h - 96, 9, 0, PI2); bx.fill();
      bx.fillStyle = '#ffd2c8';
      bx.fillRect(lx + 10, h - 100, 6, 4);
    }
    // bumper
    bx.fillStyle = '#55534a'; bx.fillRect(ox + 6, h - 26, w - 12, 14);
    // wheels + mud flaps
    bx.fillStyle = '#0a0a0a';
    bx.fillRect(ox + 12, h - 10, 44, 10); bx.fillRect(ox + w - 56, h - 10, 44, 10);
    // roof hazard tips
    bx.fillStyle = '#7a5e14';
    bx.fillRect(ox + 8, 30, 28, 5); bx.fillRect(ox + w - 36, 30, 28, 5);
    return b;
  })();

  const chunkImg = (() => {
    const c = document.createElement('canvas'); c.width = 26; c.height = 20;
    const cx = c.getContext('2d');
    cx.fillStyle = '#2a1416';
    cx.beginPath();
    cx.moveTo(2, 18); cx.lineTo(5, 4); cx.lineTo(14, 2); cx.lineTo(23, 8); cx.lineTo(20, 18);
    cx.closePath(); cx.fill();
    cx.fillStyle = 'rgba(0,0,0,0.4)';
    cx.fillRect(4, 12, 18, 5);
    return c;
  })();

  const emberImg = (() => {
    const c = document.createElement('canvas'); c.width = 12; c.height = 12;
    const ex = c.getContext('2d');
    const g = ex.createRadialGradient(6, 6, 0, 6, 6, 6);
    g.addColorStop(0, 'rgba(255,220,140,1)'); g.addColorStop(0.4, 'rgba(255,140,50,0.9)');
    g.addColorStop(1, 'rgba(255,90,30,0)');
    ex.fillStyle = g; ex.fillRect(0, 0, 12, 12);
    return c;
  })();

  // dedicated tail-light sprite: saturated red core — must read as TAIL
  // LIGHTS among the orange ember sparks, not more fire
  const tailImg = (() => {
    const c = document.createElement('canvas'); c.width = 14; c.height = 14;
    const tx = c.getContext('2d');
    const g = tx.createRadialGradient(7, 7, 0, 7, 7, 7);
    g.addColorStop(0, 'rgba(255,70,50,1)'); g.addColorStop(0.35, 'rgba(230,25,15,0.95)');
    g.addColorStop(1, 'rgba(160,10,5,0)');
    tx.fillStyle = g; tx.fillRect(0, 0, 14, 14);
    return c;
  })();

  // ---- camera + audio direction ----
  function directCamera(t) {
    const bs = busState(t);
    // track the bus from a slightly off-axis position; push in during the
    // charge; after the impact the camera keeps advancing INTO the maw
    // (slow dread push) so the hole grows to fill the frame
    const creep = Math.min(1, Math.max(0, (t - DRIVE) / (FREEZE - DRIVE))) * 3.4;
    const push = t >= CRASH ? Math.min(1, (t - CRASH) / (FREEZE - CRASH)) : 0;
    const impact = t >= CRASH ? Math.min(1, (t - CRASH) / 950) : 0;
    player.x = cam.x - 1.1 + Math.sin(t * 0.0011) * 0.03;
    player.y = cam.y + creep * 0.6 + push * 6.2 + Math.cos(t * 0.0016) * 0.02;
    player.angle = Math.PI / 2 + Math.sin(t * 0.0009) * 0.008 - 0.012;
    FOV = (78 + impact * 14) * DEG;
  }

  function spawnCrashFX() {
    // rubble: bursts out of the breach, rains along the wall
    for (let k = 0; k < 42; k++) {
      const inward = rng() > 0.5;
      chunks.push({
        wx: BX + (rng() - 0.5) * 3.2,
        wy: 29.6 + (inward ? -rng() * 0.8 : rng() * 1.4),
        vx: (rng() - 0.5) * 3.2,
        vy: inward ? -(0.6 + rng() * 1.6) : 0.4 + rng() * 1.8,
        vz: -(0.4 + rng() * 1.9),
        g: 3.4, zz: 1.1 + rng() * 0.9,
        hs: 0.12 + rng() * 0.17, rot: rng() * PI2, vr: (rng() - 0.5) * 6,
        life: 1, dec: 0.0035 + rng() * 0.0035
      });
    }
    for (let k = 0; k < 14; k++) {
      // tight ember band hugging the rim — arcs above, never into the pit
      const spread = 0.8 + rng() * 1.6;
      embers.push({
        wx: BX + (rng() - 0.5) * 3.4, wy: 29.55 - spread * 0.45, zz: 0.55 + rng() * 0.65,
        vx: (rng() - 0.5) * 1.8, vy: -0.9 - rng() * 1.4, vz: 0.5 + rng() * 1.1,
        g: -0.4, life: 1, dec: 0.009 + rng() * 0.007
      });
    }
    for (let k = 0; k < 30; k++) {
      dust.push({
        wx: BX + (rng() - 0.5) * 2.4, wy: 29.4 + rng() * 1.6, zz: 0.2 + rng() * 0.8,
        vx: (rng() - 0.5) * 0.7, vy: (rng() - 0.5) * 0.7 - (rng() > 0.5 ? 0.5 : 0), vz: -0.25 + rng() * 0.5,
        hs: 0.9 + rng() * 1.3, a: 0.26 + rng() * 0.18, life: 1, dec: 0.0035
      });
    }
    // rubble lip: static chunks parked along the breach sill — they never
    // move or fade, and read as a jagged piled rim from any camera angle
    for (let k = 0; k < 16; k++) {
      chunks.push({
        wx: BX + (rng() - 0.5) * 4.6, wy: 29.25 + rng() * 0.75,
        vx: 0, vy: 0, vz: 0, g: 0, zz: 0.03 + rng() * 0.10,
        hs: 0.16 + rng() * 0.15, rot: rng() * PI2, vr: 0,
        life: 1, dec: 0
      });
    }
    // torn-edge shrapnel clinging to the breach borders — big backlit jags,
    // a couple 2-3x taller spikes per side so they read at a glance
    for (let k = 0; k < 18; k++) {
      const side = rng() > 0.5 ? 1 : -1;
      chunks.push({
        wx: BX + side * (2.0 + rng() * 0.6), wy: 29.6 + rng() * 0.3,
        vx: 0, vy: 0, vz: 0, g: 0,
        zz: 0.35 + rng() * 0.75,
        hs: 0.28 + rng() * 0.30, rot: side * (1.1 + rng() * 0.8), vr: 0,
        life: 1, dec: 0
      });
    }
    for (const side of [-1, 1]) {
      for (let k = 0; k < 2; k++) {
        chunks.push({
          wx: BX + side * (2.15 + rng() * 0.35), wy: 29.7,
          vx: 0, vy: 0, vz: 0, g: 0,
          zz: 0.25 + rng() * 0.30,
          hs: 0.85 + rng() * 0.35, rot: side * (0.7 + rng() * 0.5), vr: 0,
          life: 1, dec: 0
        });
      }
    }
  }

  function stepFX(dt) {
    const s = dt / 1000;
    for (let i = chunks.length - 1; i >= 0; i--) {
      const c2 = chunks[i];
      c2.wx += c2.vx * s; c2.wy += c2.vy * s; c2.zz += c2.vz * s;
      c2.vz -= c2.g * s; c2.rot += c2.vr * s; c2.life -= c2.dec;
      if (c2.zz < 0.05) { c2.zz = 0.05; c2.vz *= -0.35; c2.vx *= 0.7; c2.vy *= 0.7; }
      if (c2.life <= 0) chunks.splice(i, 1);
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.wx += e.vx * s; e.wy += e.vy * s; e.zz += e.vz * s;
      e.vz += e.g * s; e.life -= e.dec;
      if (e.life <= 0) embers.splice(i, 1);
    }
    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i];
      d.wx += d.vx * s; d.wy += d.vy * s; d.zz += d.vz * s;
      d.hs += 0.25 * s; d.life -= d.dec;
      if (d.life <= 0) dust.splice(i, 1);
    }
  }

  function drawFX() {
    // airborne rubble: world-space billboards, z-clipped, rotation + bounce
    for (const c2 of chunks) {
      const pr = project(c2.wx, c2.wy);
      if (!pr.vis) continue;
      const sh = (H / pr.perp) * c2.hs;
      const sw = sh * 1.3;
      const cy = H / 2 - (c2.zz - 0.5) * sh;
      const numRays = zBuffer.length;
      const si = Math.floor(pr.sx / (W / numRays));
      if (si < 0 || si >= numRays || zBuffer[si] < pr.perp - 0.05) continue;
      x.save();
      x.translate(pr.sx, cy);
      x.rotate(c2.rot);
      x.globalAlpha = Math.min(1, c2.life * 1.6);
      x.drawImage(chunkImg, -sw / 2, -sh / 2, sw, sh);
      x.restore();
    }
    // embers: additive glows rising off the breach
    x.globalCompositeOperation = 'lighter';
    for (const e of embers) {
      const pr = project(e.wx, e.wy);
      if (!pr.vis) continue;
      const sh = (H / pr.perp) * 0.20;
      const ey = H / 2 - (e.zz - 0.5) * sh;
      const numRays = zBuffer.length;
      const si = Math.floor(pr.sx / (W / numRays));
      if (si < 0 || si >= numRays || zBuffer[si] < pr.perp - 0.05) continue;
      x.globalAlpha = Math.min(1, e.life) * 0.9;
      x.drawImage(emberImg, pr.sx - sh / 2, ey - sh / 2, sh, sh);
    }
    x.globalCompositeOperation = 'source-over';
    x.globalAlpha = 1;
    for (const d of dust) {
      const pr = project(d.wx, d.wy);
      if (!pr.vis) continue;
      const sh = (H / pr.perp) * d.hs;
      x.globalAlpha = d.a * Math.min(1, d.life);
      const g = x.createRadialGradient(pr.sx, H / 2 - (d.zz - 0.5) * sh, 0, pr.sx, H / 2 - (d.zz - 0.5) * sh, sh);
      g.addColorStop(0, `rgba(122,104,92,${0.55 * d.a * Math.min(1, d.life) + 0.2})`);
      g.addColorStop(1, 'rgba(122,104,92,0)');
      x.fillStyle = g;
      x.beginPath(); x.arc(pr.sx, H / 2 - (d.zz - 0.5) * sh, sh, 0, PI2); x.fill();
    }
    x.globalAlpha = 1;
  }

  function flashScreen(strength) {
    flashL.style.transition = 'opacity 0.04s';
    flashL.style.opacity = String(strength);
    setTimeout(() => {
      flashL.style.transition = 'opacity 0.9s ease';
      flashL.style.opacity = '0';
    }, 110);
  }
  let flashClearTimer = 0;

  function paint(t, dt) {
    if (t >= REV && !revved) { revved = true; endingAudio.rev && endingAudio.rev(); }
    if (t >= CRASH && !boomed) {
      boomed = true;
      endingAudio.boom && endingAudio.boom();
      flashScreen(0.92);
      // the real wall breach: rows 29-31 (incl. map border → void black
      // beyond), cols 14-18 — engine raycasts it live
      for (let cx2 = 14; cx2 <= 18; cx2++) {
        map[29][cx2] = 0; map[30][cx2] = 0; map[31][cx2] = 0;
      }
      const grow = setInterval(() => {
        // hole keeps widening for ~2s after impact (cols 13-19 all rows)
        for (let cx2 = 13; cx2 <= 19; cx2++) {
          map[29][cx2] = 0; map[30][cx2] = 0; map[31][cx2] = 0;
        }
      }, 900);
      setTimeout(() => clearInterval(grow), 2000);
      spawnCrashFX();
      setTimeout(() => { try { endingAudio.ctx.currentTime; } catch (e) {} }, 0);
    }
    directCamera(t);
    if (holdT < 0) stepFX(dt);   // holds are deterministic snapshots
    // post-crash smoke lazily belching off the wreck
    if (t > CRASH && holdT < 0) {
      smokeClock += dt;
      if (smokeClock > 260) {
        smokeClock = 0;
        const bs2 = busState(t);
        dust.push({
          wx: bs2.x + (rng() - 0.5) * 1.4, wy: bs2.z - 0.3, zz: 0.55 + rng() * 0.3,
          vx: (rng() - 0.5) * 0.3, vy: -0.35 - rng() * 0.3, vz: 0.12 + rng() * 0.1,
          hs: 0.7 + rng() * 0.9, a: 0.20 + rng() * 0.14, life: 1, dec: 0.0038
        });
      }
    }

    // cinematic grade: warm light bleeding around the breach — drawn on the
    // game canvas (already rendered this frame by gameLoop) beneath our sprites
    try {
      const gp = project(BX, 29.8);
      if (gp.vis && gp.perp < 26) {
        // spill light lands on the FLOOR in front of the hole — the pit
        // interior itself stays void-black so the maw reads as a hole
        const R = Math.min(W, (H / gp.perp) * 1.9);
        const pre = t < CRASH;
        const inten = pre ? 0.04 : Math.min(0.09, 0.04 + 0.05 * Math.max(0, 1 - (t - CRASH) / 8000));
        const col = pre ? '255,190,110' : '255,150,70';
        const gy = H * 0.80;
        // glow clipped BELOW the rim line — nothing blooms up into the maw
        const rimY = H / 2 + (H / gp.perp) * 0.5;
        x.save();
        x.beginPath();
        x.rect(0, rimY, W, H - rimY);
        x.clip();
        const g = ctx.createRadialGradient(gp.sx, gy, 0, gp.sx, gy, R);
        g.addColorStop(0, `rgba(${col},${inten})`);
        g.addColorStop(0.55, `rgba(${col},${inten * 0.35})`);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        x.restore();
      }
    } catch (err) { /* grade is cosmetic */ }

    // game canvas already renders the world via gameLoop(); draw the bus
    // billboard + particles on the overlay canvas (z-clipped above).
    if (!frozen) {
      x.clearRect(0, 0, W, H);
      const bs = busState(t);
      // swallow: fade the body fast once it crosses the sill — silhouette
      // against the void reads "sinking into black," not "lit by glow"
      let alpha = 1;
      if (bs.z > CRASH_Z + 0.7) {
        alpha = Math.max(0, 1 - (bs.z - (CRASH_Z + 0.7)) / 0.9);
      }
      // tail lights: bright pulse through the charge; after the swallow just
      // two slim sinking points — no flare blob, the void stays black
      const tw = t >= IGN
        ? (bs.z > CRASH_Z + 1.1 ? 0.22 * alpha : 0.55 + 0.45 * Math.sin(t * 0.03))
        : 0.25;
      // tail lights sink a beat slower than the body — last things to go
      const lzoff = bs.z > CRASH_Z ? 0.16 : -0.02;
      const lsz = bs.z > CRASH_Z ? 0.26 : 0.16;
      drawWorldSprite(tailImg, bs.x - 0.32, Math.max(bs.z - lzoff, bs.z - 0.16), lsz, tw, true);
      drawWorldSprite(tailImg, bs.x + 0.32, Math.max(bs.z - lzoff, bs.z - 0.16), lsz, tw, true);
      if (alpha > 0.02) drawWorldSprite(busImg, bs.x, bs.z, 1.72, alpha, false);
      drawFX();
    }
    if (t >= TEXT && !textShown) {
      textShown = true;
      document.getElementById('ending-text').classList.add('show');
    }
  }

  function frame(ts) {
    if (!startTs) startTs = ts;
    const t = holdT >= 0 ? holdT : (seekT >= 0 ? seekT : (ts - startTs));
    const dt = Math.min(50, (seekT >= 0 || holdT >= 0) ? 16 : ts - (runEndingCinematic._last || ts));
    runEndingCinematic._last = ts;
    const prevSeek = seekT; seekT = -1;
    const tUse = prevSeek >= 0 ? prevSeek : t;
    runEndingCinematic._now = tUse;
    runEndingCinematic._boomed = boomed;
    if (tUse >= FREEZE) { paint(FREEZE, dt); freeze(); return; }
    paint(tUse, dt);
    raf = requestAnimationFrame(frame);
  }

  // black hold: the game fade-out (1.15s CSS) plays first over the frozen
  // gameplay frame; once black is fully down, lift it and start the engine
  // shot (reads as the scene fading in from black). Seek hooks jump
  // straight out of black for tests, bypassing both timers.
  window._endingSeek = v => { seekT = v; holdT = v; blackL.style.opacity = '0'; };
  window._endingHold = v => { holdT = v; };
  setTimeout(() => {
    blackL.style.opacity = '0';
    runEndingCinematic._last = performance.now();
    raf = requestAnimationFrame(frame);
  }, 1900);
}

// ---- DEEP LINK — ?level=N boots straight into that level (1-based) ----
(function deepLinkBoot() {
  const p = new URLSearchParams(location.search).get('level');
  if (p === null) return;
  const n = parseInt(p, 10);
  if (isNaN(n) || n < 1 || n > LEVELS.length) return;
  startGame(n - 1);
})();

// ---- SPAWN SANITY CHECK — every level's player start must be on open floor
// with at least one walkable neighbor. (A vault-seal once walled E1M10's spawn
// into a stone tile; the player materialized inside a wall and couldn't move.)
(function validateSpawns() {
  const walk = t => t === 0 || t === 5;
  LEVELS.forEach((lvl, i) => {
    const g = lvl.map, cx = Math.floor(lvl.player.x), cy = Math.floor(lvl.player.y);
    const problems = [];
    if (cy < 0 || cy >= g.length || cx < 0 || cx >= g[0].length) problems.push('out of bounds');
    else {
      if (!walk(g[cy][cx])) problems.push(`spawn cell (${cx},${cy}) is solid tile ${g[cy][cx]}`);
      const n4 = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx, dy]) => {
        const ny = cy + dy, nx = cx + dx;
        return ny >= 0 && ny < g.length && nx >= 0 && nx < g[0].length && walk(g[ny][nx]);
      });
      if (!n4.length && !problems.length) problems.push('fully enclosed by solids');
    }
    if (problems.length) {
      console.error(`LEVEL DATA BUG — ${lvl.name}: ${problems.join('; ')}`);
    }
  });
})();
</script>
