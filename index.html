<meta property="og:title" content="CATCH THAT BUS">
<meta property="og:description" content="Night-shift exterminator racing the last bus out of the hive. Ten levels of swarming corridors, secret vaults and hidden arsenals — ride the bus out or don't ride at all.">
<meta property="og:image" content="https://gms.gonna.qzz.io/screenshots/catch-that-bus.png?v=2">

<title>CATCH THAT BUS</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#game-canvas { display: block; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }

#hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

#crosshair {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  color: #0f0; font-size: 24px; text-shadow: 0 0 4px #0f0;
  opacity: 0.8; font-weight: bold;
}

#status-top {
  position: absolute; top: 12px; right: 20px;
  display: flex; gap: 8px; align-items: stretch;
}
#health-display {
  color: #0f0; font-size: 18px; font-weight: bold;
  text-shadow: 0 0 8px #0f044;
  background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 6px;
  border: 2px solid #0f0;
}
#health-display.low { color: #f44; text-shadow: 0 0 8px #f004; border-color: #f44; }

#ammo-display {
  color: #ff0; font-size: 18px; font-weight: bold;
  text-shadow: 0 0 8px #ff044;
  background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 6px;
  border: 2px solid #ff0;
  text-align: center;
  min-width: 64px;
}


#message {
  position: absolute; top: 40%; right: 24px; transform: translateY(-50%);
  color: #0f0; font-size: 28px; font-weight: bold; letter-spacing: 4px;
  text-shadow: 0 0 20px #0f0, 0 0 40px #0f088;
  text-align: right; display: none;
}

#damage-flash {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255,0,0,0); transition: background 0.1s;
  pointer-events: none;
}

#mobile-controls {
  position: fixed; bottom: 0; left: 0; width: 100%; height: 160px;
  pointer-events: none; z-index: 20; display: none;
}
#joystick-zone {
  position: absolute; left: 10px; bottom: 10px; width: 140px; height: 140px;
  pointer-events: auto; touch-action: none;
}
#joystick-base {
  position: absolute; left: 0; top: 0; width: 140px; height: 140px;
  border-radius: 50%; background: rgba(0,255,0,0.08); border: 2px solid rgba(0,255,0,0.25);
}
#joystick-thumb {
  position: absolute; width: 50px; height: 50px;
  border-radius: 50%; background: rgba(0,255,0,0.2); border: 2px solid rgba(0,255,0,0.5);
  left: 45px; top: 45px; transition: none;
  pointer-events: none;
}
#btn-shoot { display: none; }
#btn-use {
  position: absolute; right: 110px; bottom: 30px; width: 56px; height: 56px;
  pointer-events: auto; border-radius: 50%;
  background: rgba(255,255,0,0.08); border: 2px solid #ff0;
  color: #ff0; font-size: 13px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#btn-use:active, #btn-use.pressed { background: rgba(255,255,0,0.3); border-color: #ff0; }

#title-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#title-screen h1 {
  font-size: 72px; color: #c00; text-shadow: 0 0 40px #f008, 0 0 80px #f004;
  letter-spacing: 12px; margin-bottom: 20px;
}
#title-bus {
  display: block; margin: 0 auto 6px auto;
  max-width: 86vw; height: auto;
  image-rendering: pixelated;
}
#title-screen p { color: #666; font-size: 16px; margin: 8px 0; }
#title-screen .start-btn {
  margin-top: 40px; padding: 16px 48px;
  background: #c00; color: #fff; border: none; border-radius: 8px;
  font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold;
  letter-spacing: 4px; cursor: pointer;
  box-shadow: 0 0 30px #f0044;
  pointer-events: auto;
}
#title-screen .start-btn:hover { background: #f00; box-shadow: 0 0 40px #f0088; }
#title-screen .controls-info {
  color: #444; font-size: 13px; margin-top: 30px; text-align: center; line-height: 2;
}

#death-screen, #win-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); z-index: 100; display: none;
  flex-direction: column; align-items: center; justify-content: center;
}
#death-screen h1 { font-size: 56px; color: #c00; letter-spacing: 8px; text-shadow: 0 0 30px #f006; }
#death-screen p { display: none; }
#win-screen h1 { font-size: 56px; color: #0f0; letter-spacing: 8px; text-shadow: 0 0 30px #0f08; }
#win-screen p { color: #888; font-size: 16px; margin-top: 20px; }
.restart-btn {
  margin-top: 30px; padding: 14px 40px;
  background: #333; color: #0f0; border: 2px solid #0f0; border-radius: 8px;
  font-family: 'Courier New', monospace; font-size: 18px; letter-spacing: 3px;
  cursor: pointer; pointer-events: auto;
}
.restart-btn:hover { background: #0f0; color: #000; }

#ending {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; z-index: 200; display: none;
  opacity: 0; transition: opacity 1.1s ease;
  pointer-events: none;
}
#ending canvas { position: absolute; top: 0; left: 0; display: block; }
#ending-black {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: #000; opacity: 0; transition: opacity 1.15s ease;
}
#ending-flash {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: #fff8e8; opacity: 0; pointer-events: none;
}
#ending-text {
  position: absolute; top: 30%; right: 24px;
  text-align: right; font-family: 'Courier New', monospace;
  font-size: clamp(17px, 4.6vw, 30px); letter-spacing: 6px;
  color: #e6ddc4; text-shadow: 0 0 22px rgba(230, 214, 160, 0.35);
  opacity: 0; transition: opacity 1.6s ease;
}
#ending-text.show { opacity: 1; }
#ending.tap { pointer-events: auto; cursor: pointer; }

#minimap {
  position: absolute; top: 12px; left: 12px;
  border: 1px solid #0f044; border-radius: 4px;
  background: rgba(0,0,0,0.7);
}

#btn-map {
  position: absolute; top: 12px; left: 12px; width: 64px; height: 32px;
  pointer-events: auto; border-radius: 4px;
  background: rgba(0,0,0,0.7); border: 1px solid #0a0;
  color: #0a0; font-size: 9px; font-weight: bold; letter-spacing: 2px;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#btn-map:active { background: rgba(0,255,0,0.15); }

#btn-switch {
  position: absolute; right: 175px; bottom: 40px; width: 50px; height: 50px;
  pointer-events: auto; border-radius: 50%;
  background: rgba(0,255,255,0.08); border: 2px solid #0ff;
  color: #0ff; font-size: 10px; font-weight: bold;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#btn-switch:active { background: rgba(0,255,255,0.3); }

</style>

<canvas id="game-canvas"></canvas>

<div id="hud">
  <div id="crosshair">+</div>
  <div id="message"></div>
  <div id="damage-flash"></div>
  <div id="btn-map">MAP</div>
  <canvas id="minimap" width="140" height="140"></canvas>
  <div id="status-top">
    <div id="health-display">HP 100</div>
    <div id="ammo-display">50 <span style="font-size:11px;color:#aa0;">PISTOL</span></div>
  </div>
</div>

<div id="mobile-controls">
  <div id="joystick-zone"><div id="joystick-base"></div><div id="joystick-thumb"></div></div>
  <div id="btn-use">USE</div>
  <div id="btn-switch">SWAP</div>
</div>

<div id="title-screen">
  <h1>CATCH THAT BUS</h1>
  <canvas id="title-bus" width="420" height="236"></canvas>
  <button class="start-btn" onclick="startGame()">ENTER</button>
  <div class="controls-info">
    WASD — Move & Strafe &bull; Mouse — Look &bull; Click — Shoot<br>
    1-4 — Switch Weapons &bull; E — Open door / Use &bull; Mobile — Joystick, drag to look, SWAP to cycle guns
  </div>
</div>

<div id="death-screen">
  <h1>YOU MISSED YOUR BUS</h1>
  <p id="death-msg">You missed your bus.</p>
  <button class="restart-btn" onclick="restartGame()">TRY AGAIN</button>
</div>

<div id="win-screen">
  <h1>EXIT FOUND</h1>
  <p id="win-msg">You made it out alive.</p>
  <button class="restart-btn" onclick="nextLevel()">NEXT LEVEL</button>
</div>

<div id="ending">
  <div id="ending-black"></div>
  <canvas id="ending-canvas"></canvas>
  <div id="ending-flash"></div>
  <div id="ending-text">UPTOWN, HERE WE COME!</div>
</div>

// Re-tint all wall textures for the current level's palette. Called from
// initLevel. Pristine copies are captured once, so re-tinting never stacks
// when replaying / switching levels.
function applyLevelPalette(lvl) {
  if (!applyLevelPalette._pristine) {
    applyLevelPalette._pristine = {};
    for (const k of Object.keys(wallVariants)) {
      applyLevelPalette._pristine[k] = wallVariants[k].map(tex => {
        const cl = document.createElement('canvas'); cl.width = tex.width; cl.height = tex.height;
        cl.getContext('2d').drawImage(tex, 0, 0);
        return cl;
      });
    }
  }
  const pal = PALETTES[lvl.hue] || null;
  const pri = applyLevelPalette._pristine;
  for (const k of Object.keys(wallVariants)) {
    for (let i = 0; i < wallVariants[k].length; i++) {
      const tex = wallVariants[k][i], c = tex.getContext('2d');
      c.globalCompositeOperation = 'copy'; // wipe + restore pristine
      c.drawImage(pri[k][i], 0, 0);
      if (pal) {
        c.globalCompositeOperation = 'source-atop';
        const afford = (k === 5 || k === 7 || k === '7a'); // exit/switch stay recognisable
        c.globalAlpha = afford ? pal.tintAmt * 0.4 : pal.tintAmt;
        c.fillStyle = pal.tint;
        c.fillRect(0, 0, tex.width, tex.height);
        c.globalAlpha = 1;
      }
      c.globalCompositeOperation = 'source-over';
    }
  }
  storePalette(pal || { skyTop: '#05030a', skyBot: '#140a12', floor: ['#170e08','#100a06','#070402'], rim: '#a06bb8' });
}

// current level's palette, consumed by render() for sky/floor/rim colors
let curPalette = { skyTop: '#05030a', skyBot: '#140a12', floor: ['#170e08','#100a06','#070402'], rim: '#a06bb8' };
function storePalette(p) { curPalette = p; }

// ---- PROCEDURAL TEXTURES ----
const TEX_SIZE = 64; // 64x64 pixel textures
const wallTextures = {};

function genTexture(id, fn) {
  const c = document.createElement('canvas');
  c.width = c.height = TEX_SIZE;
  const x = c.getContext('2d');
  fn(x, TEX_SIZE);
  return c;
}

// Simple hash for deterministic noise
function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) & 0xff) / 255; }

function initTextures() {
  // Helper: draw grime streaks on a texture
  function addGrime(ctx, S, count, color) {
    for (let i = 0; i < count; i++) {
      const gx = hash(i*3, 77) * S;
      const gy = hash(i*3+1, 77) * S;
      const gw = 2 + hash(i*3+2, 77) * 8;
      const gh = 4 + hash(i, 88) * 16;
      ctx.fillStyle = color || `rgba(${30+Math.floor(hash(i,99)*40)},${20+Math.floor(hash(i,77)*30)},${10+Math.floor(hash(i,55)*20)},${0.15+hash(i,44)*0.25})`;
      ctx.fillRect(gx, gy, gw, gh);
    }
  }
  // Helper: add cracks
  function addCracks(ctx, S, count) {
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 1;
    for (let i = 0; i < count; i++) {
      let cx = hash(i*5, 33) * S, cy = hash(i*5+1, 33) * S;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      const segs = 2 + Math.floor(hash(i*5+2, 33) * 4);
      for (let s = 0; s < segs; s++) {
        cx += (hash(i*5+s*2, 55) - 0.5) * 12;
        cy += hash(i*5+s*2+1, 55) * 10;
        ctx.lineTo(cx, cy);
      }
      ctx.stroke();
    }
  }
  // Helper: add stains/drips
  function addStains(ctx, S, count) {
    for (let i = 0; i < count; i++) {
      const sx = hash(i*4, 22) * S;
      const sy = hash(i*4+1, 22) * S;
      const sr = 2 + hash(i*4+2, 22) * 5;
      ctx.fillStyle = `rgba(20,15,10,${0.15+hash(i*4+3,22)*0.2})`;
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fill();
      // Drip down from stain
      if (hash(i, 66) > 0.5) {
        ctx.fillRect(sx-1, sy, 2, 3+hash(i,77)*8);
      }
    }
  }

  // 1: Gray-blue stone — dirty, cracked stone blocks with moss and grime
  wallTextures[1] = genTexture(1, (ctx, S) => {
    ctx.fillStyle = '#707088';
    ctx.fillRect(0, 0, S, S);
    // Stone blocks (4 rows, alternating offset)
    for (let by = 0; by < 4; by++) {
      for (let bx = 0; bx < 2; bx++) {
        const ox = by % 2 ? S/4 : 0;
        const bw = S/2 - 2, bh = S/4 - 2;
        const x1 = bx * S/2 + ox + 1, y1 = by * S/4 + 1;
        const v = 120 + Math.floor(hash(bx+by*3, by) * 35);
        ctx.fillStyle = `rgb(${v-15},${v-12},${v+5})`;
        ctx.fillRect(x1, y1, bw, bh);
        // Heavy noise on block
        for (let ny = 0; ny < 20; ny++) {
          const nx = Math.floor(hash(ny+bx*7, ny+by*13) * bw);
          const ny2 = Math.floor(hash(ny+bx*3, ny+by*11) * bh);
          const nv = Math.floor(hash(ny, ny+bx+by*5) * 80) - 40;
          ctx.fillStyle = `rgba(${nv > 0 ? 200 : 30},${nv > 0 ? 200 : 25},${nv > 0 ? 220 : 35},${0.2+Math.abs(nv)/120})`;
          ctx.fillRect(x1 + nx, y1 + ny2, 2+Math.floor(hash(ny,ny)*2), 2);
        }
        // Dark edge shadow on blocks
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(x1, y1, bw, 2);
        ctx.fillRect(x1, y1, 2, bh);
      }
    }
    // Mortar (dark, crumbling)
    ctx.strokeStyle = '#3a3a44';
    ctx.lineWidth = 2;
    for (let row = 0; row < 4; row++) {
      ctx.beginPath(); ctx.moveTo(0, row * S/4); ctx.lineTo(S, row * S/4); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(S/2, 0); ctx.lineTo(S/2, S/4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S/4, S/4); ctx.lineTo(S/4, S/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S*3/4, S/4); ctx.lineTo(S*3/4, S/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S/2, S/2); ctx.lineTo(S/2, S*3/4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S/4, S*3/4); ctx.lineTo(S/4, S); ctx.stroke();
    addCracks(ctx, S, 6);
    addStains(ctx, S, 5);
    addGrime(ctx, S, 8);
    // Moss patches
    for (let m = 0; m < 3; m++) {
      const mx = hash(m*2, 11) * S, my = hash(m*2+1, 11) * S;
      ctx.fillStyle = `rgba(${40+Math.floor(hash(m,33)*30)},${60+Math.floor(hash(m,44)*30)},${20},0.35)`;
      ctx.beginPath(); ctx.arc(mx, my, 3+hash(m,55)*4, 0, Math.PI*2); ctx.fill();
    }
  });

  // 2: Red brick — grimy, stained brick with crumbling mortar
  wallTextures[2] = genTexture(2, (ctx, S) => {
    ctx.fillStyle = '#3a1510';
    ctx.fillRect(0, 0, S, S);
    const bH = S/8, bW = S/4, mortarW = 2;
    for (let row = 0; row < 8; row++) {
      const offset = row % 2 ? bW/2 : 0;
      for (let col = -1; col < 5; col++) {
        const bx = col * bW + offset;
        const by = row * bH;
        const v = 130 + Math.floor(hash(col, row) * 55);
        ctx.fillStyle = `rgb(${v},${Math.floor(v*0.3)},${Math.floor(v*0.18)})`;
        ctx.fillRect(bx + mortarW, by + mortarW, bW - mortarW*2, bH - mortarW*2);
        // Brick texture: noise and variation
        for (let n = 0; n < 8; n++) {
          const nx = bx + mortarW + hash(n+col, row) * (bW - mortarW*2);
          const ny = by + mortarW + hash(col, n+row) * (bH - mortarW*2);
          ctx.fillStyle = `rgba(0,0,0,${0.1+hash(col+n, row+n)*0.2})`;
          ctx.fillRect(nx, ny, 2+Math.floor(hash(n,col)*2), 1+Math.floor(hash(n,row)*2));
        }
        // Dark edge on each brick
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(bx + mortarW, by + mortarW, bW - mortarW*2, 1);
        ctx.fillRect(bx + mortarW, by + mortarW, 1, bH - mortarW*2);
      }
    }

  // 7a: Activated switch (green indicator)
  wallTextures['7a'] = genTexture('7a', (ctx, S) => {
    ctx.fillStyle = '#2a3a4a';

    panels.forEach(([px, py], idx) => {

      ctx.fillRect(px, py, pw, ph);

    ctx.beginPath(); ctx.arc(S/2, S*0.4, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(100,255,100,0.3)';

    ctx.fillStyle = '#0a1a2a';
    ctx.fillRect(S*0.3, S*0.52, S*0.4, S*0.12);
    ctx.fillStyle = '#667788';
    ctx.font = `bold ${S/10}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('SWITCH', S/2, S*0.61);
    addStains(ctx, S, 3);
    addGrime(ctx, S, 4);

// ---- BIO VARIANTS: abstract organic wall textures + anti-tile variants ----
// Overrides the original textures. Each tile type gets 3 variants re-seeded per
// page load; the renderer picks one by world-tile position so no two adjacent
// wall tiles show the same pattern, killing visible tiling.
const wallVariants = {};
(function bioVariants() {
  const S = TEX_SIZE, VR = 3;
  const vseed = (Math.random() * 65535) | 0;
  function rh(x, y) { // per-load randomized hash — same call = same pixel, every load differs
    let h = ((x | 0) * 374761393 + (y | 0) * 668265263 + vseed * 975319) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return ((h >>> 0) & 0xff) / 255;
  }
  const darken = (c, a) => { c.fillStyle = `rgba(0,0,0,${a})`; c.fillRect(0, 0, S, S); };
  function blob(c, x, y, r, col) {
    const g = c.createRadialGradient(x, y, r * 0.12, x, y, r);
    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, PI2); c.fill();
  }
  function veinNet(c, n, r, g, b, a) { // wandering veins with capillary branches
    c.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      let x = rh(i * 3 + 1, 11) * S, y = rh(i * 3 + 2, 13) * S, va = rh(i * 3, 5) * PI2;
      c.strokeStyle = `rgba(${r},${g},${b},${a + rh(i * 7, 3) * 0.12})`;
      c.lineWidth = 0.7 + rh(i, 9) * 1.6;
      c.beginPath(); c.moveTo(x, y);
      const segs = 4 + ((rh(i, 7) * 3) | 0);
      for (let s = 0; s < segs; s++) {
        va += (rh(i * 7 + s, 17) - 0.5) * 1.3;
        x += Math.cos(va) * (3 + rh(i + s, 19) * 9);
        y += Math.sin(va) * (3 + rh(i + s + 1, 23) * 7);
        c.lineTo(x, y);
        if (rh(i + s, 29) > 0.62) {
          const ba = va + (rh(i + s * 3, 31) > 0.5 ? 0.95 : -0.95);
          c.moveTo(x, y);
          c.lineTo(x + Math.cos(ba) * (3 + rh(i + s * 2, 37) * 7), y + Math.sin(ba) * (3 + rh(i + s * 2 + 1, 41) * 6));
          c.moveTo(x, y);
        }
      }
      c.stroke();
    }
  }
  function pores(c, n, base) {
    for (let i = 0; i < n; i++) {
      const x = rh(i * 4 + 1, 43) * S, y = rh(i * 4 + 2, 47) * S, r2 = 0.8 + rh(i * 4 + 3, 53) * 2.2;
      c.fillStyle = base; c.beginPath(); c.arc(x, y, r2, 0, PI2); c.fill();
      c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.arc(x, y, r2 * 0.45, 0, PI2); c.fill();
    }
  }
  function sheen(c) { // asymmetric wet-organic sheen
    const g = c.createLinearGradient(0, 0, S, S);
    g.addColorStop(0, `rgba(190,170,215,${0.05 + rh(1, 61) * 0.07})`);
    g.addColorStop(0.4, 'rgba(0,0,0,0)');
    g.addColorStop(0.8, `rgba(95,60,115,${0.04 + rh(2, 67) * 0.06})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
  }
  function grime(c, n, a) {
    for (let i = 0; i < n; i++) {
      c.fillStyle = `rgba(8,5,3,${a * (0.5 + rh(i, 233))})`;
      c.fillRect(rh(i * 3 + 1, 239) * S, rh(i * 3 + 2, 241) * S, 2 + rh(i, 251) * 6, 3 + rh(i + 5, 257) * 10);
    }
  }
  function splotches(c, n) {
    for (let i = 0; i < n; i++) {
      const x = rh(i * 4 + 1, 263) * S, y = rh(i * 4 + 2, 269) * S, r2 = 2 + rh(i * 4 + 3, 271) * 5;
      c.fillStyle = `rgba(12,8,8,${0.14 + rh(i, 277) * 0.15})`;
      c.beginPath(); c.arc(x, y, r2, 0, PI2); c.fill();
      if (rh(i, 281) > 0.5) c.fillRect(x - 1, y, 2, 3 + rh(i, 283) * 7); // drip
    }
  }

  // 1+6: living membrane wall (6 = paler secret variant w/ faint outline)
  const membrane = (c, pale) => {
    const bg = c.createRadialGradient(S * 0.5, S * 0.42, S * 0.1, S * 0.5, S * 0.5, S * 0.72);
    if (pale) { bg.addColorStop(0, '#584f62'); bg.addColorStop(1, '#3b3444'); }
    else { bg.addColorStop(0, '#423a4c'); bg.addColorStop(1, '#282230'); }
    c.fillStyle = bg; c.fillRect(0, 0, S, S);
    for (let b = 0; b < 7; b++) {
      blob(c, rh(b * 3 + 1, 71) * S, rh(b * 3 + 2, 73) * S, 5 + rh(b, 79) * 15,
        pale ? 'rgba(96,86,110,0.45)' : `rgba(${56 + ((rh(b, 83) * 14) | 0)},${46 + ((rh(b, 89) * 10) | 0)},${64 + ((rh(b, 97) * 14) | 0)},0.5)`);
    }
    veinNet(c, 5, 178, 150, 195, 0.18);
    for (let q = 0; q < 2 + ((rh(3, 91) * 2) | 0); q++) { // cysts
      const x = rh(q * 2 + 1, 101) * S, y = rh(q * 2 + 2, 103) * S, r2 = 2 + rh(q, 107) * 3.5;
      c.fillStyle = 'rgba(64,38,50,0.75)'; c.beginPath(); c.arc(x, y, r2, 0, PI2); c.fill();
      c.fillStyle = 'rgba(160,120,140,0.35)'; c.beginPath(); c.arc(x - r2 * 0.3, y - r2 * 0.3, r2 * 0.4, 0, PI2); c.fill();
    }
    pores(c, 14, 'rgba(22,14,24,0.75)');
    splotches(c, 4); grime(c, 6, 0.35); darken(c, 0.18);
  };

  // 2: vessel door — flesh panel, cartilage arcs, radiating veins
  const vessel = (c) => {
    c.fillStyle = '#250a0e'; c.fillRect(0, 0, S, S);
    const bg = c.createRadialGradient(S * 0.5, S * 0.45, S * 0.05, S * 0.5, S * 0.5, S * 0.72);
    bg.addColorStop(0, '#47121a'); bg.addColorStop(1, '#1c060a');
    c.fillStyle = bg; c.fillRect(0, 0, S, S);
    const acx = S * (0.38 + rh(1, 113) * 0.24), acy = S * (0.4 + rh(2, 117) * 0.2);
    for (let i = 0; i < 4; i++) { // off-center cartilage rings
      c.strokeStyle = `rgba(${118 + i * 10},${30 + i * 6},36,0.42)`;
      c.lineWidth = 2.5 - i * 0.45;
      c.beginPath(); c.arc(acx, acy, 6 + i * (5 + rh(i, 127) * 4), 0, PI2); c.stroke();
    }
    veinNet(c, 6, 172, 40, 48, 0.26);
    // bulbous valve core, off-axis
    blob(c, acx, acy, 8 + rh(5, 131) * 6, 'rgba(120,26,34,0.65)');
    pores(c, 9, 'rgba(80,16,20,0.8)');
    sheen(c); splotches(c, 5); grime(c, 5, 0.4); darken(c, 0.2);
  };

  // 3: hive — clustered organic cell tubes
  const hive = (c) => {
    c.fillStyle = '#0d2012'; c.fillRect(0, 0, S, S);
    for (let row = 0; row < 5; row++) {
      const ry = row * (S / 5) + (rh(row, 139) - 0.5) * 4;
      const off = rh(row + 9, 149) * 8;
      for (let col = -1; col < 7; col++) {
        const x = col * (S / 6) + off + (rh(row * 7 + col, 151) - 0.5) * 3;
        const r3 = 3.4 + rh(row * 11 + col, 157) * 2.6;
        const sunk = rh(row * 13 + col, 163) > 0.72;
        const cy = ry + S / 10;
        c.fillStyle = sunk ? 'rgba(5,13,8,0.95)' : 'rgba(28,62,34,0.8)';
        c.beginPath(); c.arc(x, cy, r3, 0, PI2); c.fill();
        c.fillStyle = sunk ? '#040b06' : `rgba(${18 + ((rh(col, row) * 16) | 0)},${44 + ((rh(col, row + 2) * 22) | 0)},25,0.85)`;
        c.beginPath(); c.arc(x, cy, r3 * 0.6, 0, PI2); c.fill();
        c.strokeStyle = 'rgba(115,185,125,0.15)'; c.lineWidth = 1;
        c.beginPath(); c.arc(x, cy, r3, -2.4, -0.5); c.stroke();
      }
    }
    veinNet(c, 3, 60, 130, 70, 0.13);
    sheen(c); splotches(c, 3); darken(c, 0.2);
  };

  // 4: bark-flesh — wavy organic ridges and knot whorls (no straight planks)
  const bark = (c) => {
    const bg = c.createLinearGradient(0, 0, 0, S);
    bg.addColorStop(0, '#2c1e10'); bg.addColorStop(1, '#1a1108');
    c.fillStyle = bg; c.fillRect(0, 0, S, S);
    for (let px = 0; px < S; px += 4 + rh(px, 169) * 5) {
      const rr = rh(px * 3, 173);
      c.strokeStyle = `rgba(${58 + ((rr * 30) | 0)},${40 + ((rr * 18) | 0)},19,0.55)`;
      c.lineWidth = 1.4 + rr * 2.2;
      c.beginPath();
      let yy = -2, xx = px + (rr - 0.5) * 4;
      c.moveTo(xx, yy);
      while (yy < S + 2) {
        yy += 7; const prev = xx;
        xx += Math.sin(yy * 0.11 + rr * 9) * 2.2 + (rh(px * 5 + yy, 179) - 0.5) * 1.7;
        c.lineTo(xx, yy);
        if (rh(px + yy, 181) > 0.9) { // occasional branch junction
          c.strokeStyle = 'rgba(0,0,0,0.4)';
          c.beginPath(); c.moveTo(prev, yy - 7); c.lineTo(xx, yy); c.stroke();
          c.strokeStyle = `rgba(${58 + ((rr * 30) | 0)},${40 + ((rr * 18) | 0)},19,0.55)`;
          c.beginPath(); c.moveTo(xx, yy); c.lineWidth = 1.4 + rr * 2.2;
        }
      }
      c.stroke();
      // soft dark inter-ridge shading (curved, follows the ridge sway)
      c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 1.8;
      c.beginPath();
      let sy = 0, sxx = px - 1.2;
      c.moveTo(sxx, sy);
      while (sy < S) { sy += 8; sxx += Math.sin(sy * 0.11 + rr * 9) * 2.2; c.lineTo(sxx, sy); }
      c.stroke();
    }
    // knot whorls
    for (let k = 0; k < 2; k++) {
      const kx = rh(k, 191) * S, ky = rh(k + 3, 193) * S;
      for (let w2 = 0; w2 < 3; w2++) {
        c.strokeStyle = `rgba(${92 - w2 * 18},${62 - w2 * 12},24,0.4)`;
        c.lineWidth = 1.4;
        c.beginPath(); c.ellipse(kx, ky, 2 + w2 * 3.2, 1.4 + w2 * 2.4, rh(k, w2) * PI, 0, PI2); c.stroke();
      }
      c.fillStyle = 'rgba(8,5,2,0.85)'; c.beginPath(); c.arc(kx, ky, 1.6, 0, PI2); c.fill();
    }
    // pale lichen specks
    for (let l = 0; l < 8; l++) {
      c.fillStyle = `rgba(150,160,120,${0.05 + rh(l, 197) * 0.09})`;
      c.beginPath(); c.arc(rh(l, 199) * S, rh(l + 20, 211) * S, 1 + rh(l, 223) * 2, 0, PI2); c.fill();
    }
    splotches(c, 4); darken(c, 0.18);
  };

  // 8: chitinous carapace locked door — amber seams, keeps keyhole plate
  const carapace = (c) => {
    const bg = c.createLinearGradient(0, 0, S, S);
    bg.addColorStop(0, '#1c1309'); bg.addColorStop(1, '#100a05');
    c.fillStyle = bg; c.fillRect(0, 0, S, S);
    const plates = [[3, 3, S * 0.52, S * 0.42], [S * 0.58, 5, S * 0.39, S * 0.34], [S * 0.52, S * 0.44, S * 0.45, S * 0.53], [4, S * 0.5, S * 0.42, S * 0.47]];
    for (const [px, py, pw, ph] of plates) {
      const g = c.createLinearGradient(px, py, px + pw, py + ph);
      const v = 28 + rh(px, 203) * 14;
      g.addColorStop(0, `rgb(${v + 10},${v + 4},${v - 8})`);
      g.addColorStop(1, `rgb(${v - 6},${v - 9},${v - 13})`);
      c.fillStyle = g; c.fillRect(px, py, pw, ph);
      c.strokeStyle = `rgba(${125 + ((rh(px, 209) * 55) | 0)},${75 + ((rh(px, 211) * 30) | 0)},18,0.6)`;
      c.lineWidth = 1.1; c.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
      for (let p = 0; p < 4; p++) { // pit scars
        c.fillStyle = 'rgba(0,0,0,0.5)';
        c.beginPath(); c.arc(px + rh(px + p, 223) * pw, py + rh(px + p + 7, 227) * ph, 0.8 + rh(px + p + 2, 227) * 1.7, 0, PI2); c.fill();
      }
    }
    // lock affordance: dark plate + bronze keyhole (readable as locked)
    c.fillStyle = '#0c0803'; c.fillRect(S * 0.38, S * 0.42, S * 0.24, S * 0.16);
    c.strokeStyle = 'rgba(140,100,40,0.8)'; c.lineWidth = 1; c.strokeRect(S * 0.38, S * 0.42, S * 0.24, S * 0.16);
    c.fillStyle = '#000'; c.beginPath(); c.arc(S * 0.5, S * 0.48, 3, 0, PI2); c.fill();
    c.fillRect(S * 0.5 - 1, S * 0.48, 2, 6);
    sheen(c); splotches(c, 4); darken(c, 0.2);
  };

  // 5: exit — organic panel but the sign stays bright and readable
  const exitFlesh = (c) => {
    c.fillStyle = '#051313'; c.fillRect(0, 0, S, S);
    veinNet(c, 3, 22, 70, 72, 0.2);
    c.fillStyle = '#020b0b'; c.fillRect(S * 0.12, S * 0.08, S * 0.76, S * 0.84);
    const glow = c.createLinearGradient(0, S * 0.1, 0, S * 0.9);
    glow.addColorStop(0, '#073a3a'); glow.addColorStop(0.5, '#0d5c5c'); glow.addColorStop(1, '#073a3a');
    c.fillStyle = glow; c.fillRect(S * 0.15, S * 0.11, S * 0.7, S * 0.78);
    veinNet(c, 2, 40, 190, 210, 0.1);
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(S * 0.15, S * 0.11, S * 0.7, 3); c.fillRect(S * 0.15, S * 0.11, 3, S * 0.78);
    c.fillStyle = 'rgba(190,255,240,0.92)';
    c.font = `bold ${S / 4}px monospace`; c.textAlign = 'center';
    c.fillText('EXIT', S / 2, S * 0.42);
    c.beginPath(); c.moveTo(S / 2, S * 0.52); c.lineTo(S / 2 - 7, S * 0.62); c.lineTo(S / 2 + 7, S * 0.62); c.closePath(); c.fill();
    darken(c, 0.1);
  };

  // 7/7a: bone-ribbed switch panel, red/green orb preserved
  const switchPanel = (c, activated) => {
    c.fillStyle = '#211d28'; c.fillRect(0, 0, S, S);
    for (let i = 0; i < 4; i++) { // rib arcs top & bottom
      c.strokeStyle = `rgba(${182 - i * 22},${172 - i * 22},${152 - i * 18},0.22)`;
      c.lineWidth = 2 - i * 0.3;
      c.beginPath(); c.arc(S / 2, -S * 0.42, S * (0.3 + i * 0.24), 0, PI); c.stroke();
      c.beginPath(); c.arc(S / 2, S * 1.42, S * (0.3 + i * 0.24), PI, PI2); c.stroke();
    }
    c.fillStyle = '#0f0c14'; c.fillRect(S * 0.26, S * 0.3, S * 0.48, S * 0.4);
    c.strokeStyle = 'rgba(155,145,165,0.32)'; c.lineWidth = 2;
    c.strokeRect(S * 0.26, S * 0.3, S * 0.48, S * 0.4);
    const oc = activated ? ['#003b00', '#22ff22', 'rgba(110,255,110,0.3)'] : ['#3d0000', '#ff2222', 'rgba(255,105,105,0.3)'];
    c.fillStyle = oc[0]; c.beginPath(); c.arc(S / 2, S * 0.4, 6, 0, PI2); c.fill();
    c.fillStyle = oc[1]; c.beginPath(); c.arc(S / 2, S * 0.4, 4, 0, PI2); c.fill();
    c.fillStyle = oc[2]; c.beginPath(); c.arc(S / 2, S * 0.4, 8, 0, PI2); c.fill();
    c.fillStyle = '#0d1120'; c.fillRect(S * 0.3, S * 0.52, S * 0.4, S * 0.12);
    c.fillStyle = '#8a8a9a'; c.font = `bold ${S / 10}px monospace`; c.textAlign = 'center';
    c.fillText('SWITCH', S / 2, S * 0.61);
    pores(c, 8, 'rgba(15,12,20,0.8)'); grime(c, 3, 0.3); darken(c, 0.16);
  };

  // Organic joint fringe: wavy dark lip at texture top/bottom so every
  // wall↔ceiling and wall↔floor junction reads as a curved organic seam.
  function fringe(c, vs) {
    for (let x = 0; x < S; x++) {
      const n1 = rh(x + vs * 131, 301), n2 = rh(x * 3 + vs * 131, 307);
      const dTop = Math.max(1, 2.5 + n1 * 7 + Math.sin(x * 0.21 + n2 * 9) * 2.2);
      const dBot = Math.max(2.5 + n2 * 7 + Math.sin(x * 0.19 + n1 * 8) * 2.2, 1);
      c.fillStyle = 'rgba(0,0,0,0.5)';
      c.fillRect(x, 0, 1, dTop);
      c.fillStyle = 'rgba(0,0,0,0.22)';
      c.fillRect(x, dTop, 1, dTop * 0.9);
      c.fillStyle = 'rgba(0,0,0,0.5)';
      c.fillRect(x, S - dBot, 1, dBot);
      c.fillStyle = 'rgba(0,0,0,0.22)';
      c.fillRect(x, S - dBot - dBot * 0.9, 1, dBot * 0.9);
    }
  }

  const regs = [
    [1, (x, s) => membrane(x, false)],
    [6, (x, s) => membrane(x, true)],
    [2, vessel],
    [3, hive],
    [4, bark],
    [8, carapace],
    [5, exitFlesh],
    [7, (x, s) => switchPanel(x, false)],
    ['7a', (x, s) => switchPanel(x, true)],
    // Type 9: CITY BUS HULL — grimy school-bus yellow panels, riveted ribs,
    // tall windows, and the tail end of a route sign. The last way out.
    [9, (ctx, S2) => {
      ctx.fillStyle = '#a08a22';
      ctx.fillRect(0, 0, S2, S2);
      // glowing destination sign across the very top — THE bus tell
      ctx.fillStyle = '#fff3c8';
      ctx.fillRect(3, 1, S2 - 6, 9);
      ctx.strokeStyle = '#141008';
      ctx.lineWidth = 1;
      ctx.strokeRect(3.5, 1.5, S2 - 7, 8);
      // glow halo
      ctx.fillStyle = 'rgba(255,240,190,0.28)';
      ctx.fillRect(1, 0, S2 - 2, 11);
      ctx.fillStyle = '#1a1206';
      // pixel route text "CITY 45" (abstract blocks read as glyphs at distance)
      const glyphs = [[6,2,2,5],[10,2,2,5],[15,2,1,5],[18,2,2,2],[18,5,2,2],[23,2,5,2],[24,5,2,3],[31,2,2,5],[35,2,3,3],[35,6,3,2]];
      for (const [gx2,gy2,gw,gh] of glyphs) ctx.fillRect(gx2, gy2, gw, gh);
      // two hull panels with a rub rail between
      ctx.fillStyle = '#d8c840';
      ctx.fillRect(2, 14, S2 - 4, S2/2 - 18);
      ctx.fillRect(2, S2/2 + 6, S2 - 4, S2/2 - 22);
      // rub rail
      ctx.fillStyle = '#6a5a12';
      ctx.fillRect(0, S2/2 - 4, S2, 8);
      ctx.fillStyle = '#8a7a20';
      ctx.fillRect(0, S2/2 - 4, S2, 2);
      // window band (dark reflections)
      ctx.fillStyle = '#131a20';
      ctx.fillRect(6, 16, S2 - 12, 13);
      ctx.fillStyle = 'rgba(90,110,120,0.35)';
      for (let wx = 8; wx < S2 - 10; wx += 10) {
        ctx.fillRect(wx, 17, 2, 11);
      }
      // rivets along ribs
      ctx.fillStyle = '#4a3f10';
      for (let rx = 4; rx < S2; rx += 8) {
        ctx.fillRect(rx, S2/2 + 8, 2, 2);
        ctx.fillRect(rx, S2 - 16, 2, 2);
      }
      // undercarriage: dark skirt with two TIRED wheel arches
      ctx.fillStyle = '#17140a';
      ctx.fillRect(0, S2 - 10, S2, 10);
      // tires: dark arcs with faint rim highlight
      for (const cx2 of [S2 * 0.22, S2 * 0.72]) {
        ctx.fillStyle = '#050403';
        ctx.beginPath(); ctx.arc(cx2, S2 - 9, 7.5, 0, PI2); ctx.fill();
        ctx.strokeStyle = 'rgba(120,110,80,0.5)'; // faint rim highlight
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(cx2, S2 - 9, 6, PI2 * 0.58, PI2 * 0.92); ctx.stroke();
        ctx.fillStyle = '#1c180c'; // hub
        ctx.beginPath(); ctx.arc(cx2, S2 - 9, 2.5, 0, PI2); ctx.fill();
      }
      ctx.fillStyle = '#2a2416';
      ctx.fillRect(S2 * 0.22 - 1.5, S2 - 15, 3, 5);
      ctx.fillRect(S2 * 0.72 - 1.5, S2 - 19, 3, 5);
      // grime streaks and rust blisters
      ctx.fillStyle = 'rgba(60,40,10,0.4)';
      for (let n = 0; n < 7; n++) {
        const gx = rh(n, 91) * S2;
        ctx.fillRect(gx, S2/2 + 6, 2, 8 + rh(n, 92) * 14);
      }
      ctx.fillStyle = 'rgba(120,50,20,0.5)';
      for (let n = 0; n < 4; n++) {
        ctx.beginPath();
        ctx.arc(rh(n, 93) * S2, S2/2 + 10 + rh(n, 94) * 26, 2 + rh(n, 95) * 3, 0, PI2);
        ctx.fill();
      }
      // irregular panel wear to break the vertical tiling stripes
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      for (let n = 0; n < 5; n++) {
        ctx.fillRect(rh(n, 97) * S2, 16 + rh(n, 98) * (S2/2 - 20), 3 + rh(n, 99) * 5, S2/2);
      }
      grime(ctx, 6, 0.35);
      darken(ctx, 0.10);
    }],
  ];
  for (const [id, painter] of regs) {
    wallVariants[id] = [];
    for (let v = 0; v < VR; v++) {
      const tex = genTexture(id, painter);
      // bake joint fringe (skip the exit sign — its clean frame is the affordance)
      if (id !== 5) fringe(tex.getContext('2d'), v * 2 + (typeof id === 'string' ? 1 : id));
      wallVariants[id].push(tex);
    }
    wallTextures[id] = wallVariants[id][0];
  }
})();

// ---- ENEMY SPRITE SHEETS ----
const SPRITE_W = 64, SPRITE_H = 80;
const SPRITE_FRAMES = { walk: 4, attack: 2, pain: 1, death: 3 };
const enemySprites = {};

function drawImp(ctx, frame, state) {
  // "The Crawler" — a low, skittering spider-crab horror.
  // Dark organic mass with jagged back-spikes and glowing eye-spots. No head.
  const w = SPRITE_W, h = SPRITE_H;
  const isPain = state === 'pain';
  const isAttack = state === 'attack';

  const drawBody = (ox, oy) => {
    const bob = state === 'walk' ? Math.sin(frame * Math.PI / 2) * 2 : 0;
    const legCycle = state === 'walk' ? Math.sin(frame * Math.PI / 2) : 0;
    const lunge = isAttack ? (frame === 1 ? 5 : 2) : 0;

    // ---- Legs: 3 pairs, skittering in alternating phase ----
    ctx.fillStyle = isPain ? '#fff' : '#0a0503';
    const legSets = [
      { bx: w * 0.24, by: h * 0.58, reach: 14, phase: 0 },
      { bx: w * 0.34, by: h * 0.60, reach: 16, phase: Math.PI * 0.5 },
      { bx: w * 0.44, by: h * 0.58, reach: 14, phase: Math.PI },
    ];
    for (const lg of legSets) {
      // Left leg
      const lLift = legCycle * 3 * Math.cos(lg.phase);
      ctx.beginPath();
      ctx.moveTo(lg.bx + ox, lg.by + oy);
      ctx.lineTo(lg.bx - lg.reach + ox, lg.by + 4 + lLift + oy);
      ctx.lineTo(lg.bx - lg.reach + 2 + ox, lg.by + 12 + lLift + oy);
      ctx.lineTo(lg.bx - 2 + ox, lg.by + 8 + oy);
      ctx.fill();
      // Right leg (mirror)
      const rx = w - lg.bx;
      const rLift = legCycle * 3 * Math.cos(lg.phase + Math.PI);
      ctx.beginPath();
      ctx.moveTo(rx + ox, lg.by + oy);
      ctx.lineTo(rx + lg.reach + ox, lg.by + 4 + rLift + oy);
      ctx.lineTo(rx + lg.reach - 2 + ox, lg.by + 12 + rLift + oy);
      ctx.lineTo(rx + 2 + ox, lg.by + 8 + oy);
      ctx.fill();
    }

    // ---- Body mass: irregular dark lump (no head, no neck) ----
    const by = h * 0.38 + bob;
    ctx.fillStyle = isPain ? '#fff' : '#0d0604';
    ctx.beginPath();
    ctx.moveTo(w * 0.14 + ox, by + 14 + oy);
    ctx.lineTo(w * 0.10 + ox, by + 4 + oy);
    ctx.lineTo(w * 0.22 + ox, by - 2 + oy);
    ctx.lineTo(w * 0.38 + ox, by - 7 + oy);
    ctx.lineTo(w * 0.58 + ox, by - 5 + oy);
    ctx.lineTo(w * 0.80 + ox, by + oy);
    ctx.lineTo(w * 0.88 + ox, by + 8 + oy);
    ctx.lineTo(w * 0.80 + ox, by + 22 + oy);
    ctx.lineTo(w * 0.50 + ox, by + 26 + oy);
    ctx.lineTo(w * 0.20 + ox, by + 24 + oy);
    ctx.fill();

    ctx.fillStyle = isPain ? '#fff' : '#1a0a05';
    ctx.beginPath();
    ctx.moveTo(w * 0.18 + ox, by + 12 + oy);
    ctx.lineTo(w * 0.16 + ox, by + 3 + oy);
    ctx.lineTo(w * 0.26 + ox, by - 1 + oy);
    ctx.lineTo(w * 0.42 + ox, by - 5 + oy);
    ctx.lineTo(w * 0.60 + ox, by - 3 + oy);
    ctx.lineTo(w * 0.76 + ox, by + 1 + oy);
    ctx.lineTo(w * 0.74 + ox, by + 17 + oy);
    ctx.lineTo(w * 0.50 + ox, by + 20 + oy);
    ctx.lineTo(w * 0.22 + ox, by + 18 + oy);
    ctx.fill();

    // ---- Jagged back spikes (bone/crystal shards) ----
    const spikeLift = isAttack ? (frame === 1 ? 5 : 2) : 0;
    ctx.fillStyle = isPain ? '#fff' : '#080402';
    const spikes = [
      { x: 0.26, base: 2, len: 10 },
      { x: 0.34, base: -2, len: 14 },
      { x: 0.42, base: -5, len: 18 },
      { x: 0.50, base: -4, len: 16 },
      { x: 0.58, base: -1, len: 12 },
      { x: 0.66, base: 2, len: 8 },
    ];
    for (const sp of spikes) {
      const sx = w * sp.x + ox;
      const sy = by + sp.base + oy;
      ctx.beginPath();
      ctx.moveTo(sx - 3, sy);
      ctx.lineTo(sx, sy - sp.len - spikeLift);
      ctx.lineTo(sx + 3, sy);
      ctx.fill();
    }

    // ---- Eye spots (two small glowing dots, no face) ----
    if (!isPain) {
      const fl = isAttack ? (frame === 1 ? 1.6 : 1.2) : 1;
      ctx.fillStyle = isAttack ? 'rgba(255,50,0,0.35)' : 'rgba(150,20,0,0.2)';
      ctx.beginPath(); ctx.arc(w * 0.34 + lunge + ox, by + 8 + oy, 5 * fl, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w * 0.58 + lunge + ox, by + 8 + oy, 5 * fl, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isAttack && frame === 1 ? '#ffff80' : '#cc2800';
      ctx.fillRect(w * 0.32 + lunge + ox, by + 6 + oy, 4, 3);
      ctx.fillRect(w * 0.56 + lunge + ox, by + 6 + oy, 4, 3);
    }

    // ---- Attack: lunge aura flash ----
    if (isAttack && frame === 1) {
      ctx.fillStyle = 'rgba(255,30,0,0.25)';
      ctx.beginPath();
      ctx.arc(w * 0.50 + lunge + ox, by + 10 + oy, 18, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  drawBody(1, 1);
  drawBody(0, 0);
}

function drawDemon(ctx, frame, state) {
  // "The Monolith" — a towering abstract pillar of dark flesh.
  // No humanoid anatomy. A wobbling vertical column with a single glowing
  // eye-slit, writhing tendrils, and a base of pooling darkness.
  const w = SPRITE_W, h = SPRITE_H;
  const isPain = state === 'pain';
  const isAttack = state === 'attack';

  const drawBody = (ox, oy) => {
    const wobble = state === 'walk' ? Math.sin(frame * Math.PI / 2) * 2 : 0;
    const lash = isAttack ? (frame === 1 ? 10 : 5) : 0;
    const cx = w * 0.50 + wobble;

    // ---- Tendrils (writhing from both sides) ----
    ctx.fillStyle = isPain ? '#fff' : '#1a0008';
    const tendrils = [
      { side: -1, y: 0.20, len: 16 },
      { side: -1, y: 0.34, len: 22 },
      { side: -1, y: 0.48, len: 18 },
      { side: 1, y: 0.26, len: 20 },
      { side: 1, y: 0.40, len: 24 },
      { side: 1, y: 0.54, len: 14 },
    ];
    for (const t of tendrils) {
      const baseX = cx + t.side * w * 0.16;
      const baseY = h * t.y;
      const sway = Math.sin(frame * Math.PI / 2 + t.y * 8) * 3 * t.side;
      const tipX = baseX + t.side * t.len + sway + t.side * lash;
      const tipY = baseY + t.len * 0.4;
      ctx.beginPath();
      ctx.moveTo(baseX - t.side * 2 + ox, baseY + oy);
      ctx.lineTo(tipX + ox, tipY + oy);
      ctx.lineTo(tipX + ox, tipY + 6 + oy);
      ctx.lineTo(baseX + t.side * 2 + ox, baseY + 4 + oy);
      ctx.fill();
    }

    // ---- Main column (irregular vertical mass) ----
    // Dark outline
    ctx.fillStyle = isPain ? '#fff' : '#0a0004';
    for (let y = 0; y < h * 0.90; y++) {
      const ny = y / h;
      let half;
      if (ny < 0.12) half = w * 0.26 - ny * 35;
      else if (ny < 0.72) half = w * 0.20 + Math.sin(ny * 9 + frame * 1.5) * 2;
      else half = w * 0.20 + (ny - 0.72) * 60;
      ctx.fillRect(cx - half - 1 + ox, y + oy, half * 2 + 2, 1);
    }
    // Inner flesh (dark crimson)
    ctx.fillStyle = isPain ? '#fff' : '#3a0010';
    for (let y = 1; y < h * 0.88; y++) {
      const ny = y / h;
      let half;
      if (ny < 0.12) half = w * 0.22 - ny * 28;
      else if (ny < 0.72) half = w * 0.16 + Math.sin(ny * 9 + frame * 1.5) * 1.5;
      else half = w * 0.16 + (ny - 0.72) * 50;
      ctx.fillRect(cx - half + ox, y + oy, half * 2, 1);
    }

    // ---- Vertical striations (organic veins) ----
    ctx.fillStyle = isPain ? '#fff' : '#220008';
    for (let s = -2; s <= 2; s++) {
      ctx.fillRect(cx + s * 3 + ox, h * 0.10 + oy, 1, h * 0.60);
    }

    // ---- The Eye (vertical slit, upper third) ----
    if (!isPain) {
      const fl = isAttack ? (frame === 1 ? 1.8 : 1.3) : 1;
      // Glow aura (elongated via scale)
      ctx.fillStyle = isAttack ? 'rgba(255,30,0,0.45)' : 'rgba(180,15,0,0.2)';
      ctx.save();
      ctx.translate(cx + ox, h * 0.26 + oy);
      ctx.scale(1, 1.75);
      ctx.beginPath();
      ctx.arc(0, 0, 7 * fl, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      // The slit
      ctx.fillStyle = '#ff1800';
      ctx.fillRect(cx - 2 + ox, h * 0.18 + oy, 4, h * 0.16);
      ctx.fillStyle = '#ffaa00';
      ctx.fillRect(cx - 1 + ox, h * 0.19 + oy, 2, h * 0.14);
      if (isAttack && frame === 1) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(cx - 1 + ox, h * 0.19 + oy, 2, h * 0.14);
      }
    }

    // ---- Base: pooling darkness / roots ----
    ctx.fillStyle = isPain ? '#fff' : '#080004';
    ctx.beginPath();
    ctx.moveTo(w * 0.22 + ox, h * 0.84 + oy);
    ctx.lineTo(w * 0.06 + ox, h * 0.98 + oy);
    ctx.lineTo(w * 0.94 + ox, h * 0.98 + oy);
    ctx.lineTo(w * 0.78 + ox, h * 0.84 + oy);
    ctx.fill();
    // Root tendrils spreading at base
    for (let r = 0; r < 6; r++) {
      const rx = w * 0.20 + r * 7;
      ctx.fillRect(rx + ox, h * 0.82 + oy, 3, h * 0.16);
    }

    // ---- Attack: tendril slash effect ----
    if (isAttack && frame === 1) {
      ctx.fillStyle = 'rgba(255,20,0,0.3)';
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.16 + ox, h * 0.34 + oy);
      ctx.lineTo(cx - w * 0.40 + ox, h * 0.28 + oy);
      ctx.lineTo(cx - w * 0.36 + ox, h * 0.40 + oy);
      ctx.lineTo(cx - w * 0.14 + ox, h * 0.42 + oy);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx + w * 0.16 + ox, h * 0.34 + oy);
      ctx.lineTo(cx + w * 0.40 + ox, h * 0.28 + oy);
      ctx.lineTo(cx + w * 0.36 + ox, h * 0.40 + oy);
      ctx.lineTo(cx + w * 0.14 + ox, h * 0.42 + oy);
      ctx.fill();
    }
  };

  drawBody(1, 1);
  drawBody(0, 0);
}
function drawWraith(ctx, frame, state) {
  // "The Drift" — a floating pulsing orb-ring with dangling wisps.
  const w = SPRITE_W, h = SPRITE_H;
  const isPain = state === 'pain';
  const isAttack = state === 'attack';
  const float = state === 'walk' ? Math.sin(frame * Math.PI / 2) * 4 : 0;
  const pulse = isAttack ? (frame === 1 ? 1.4 : 1.1) : 1;
  const cx = w * 0.50, cy = h * 0.36 + float;

  const drawBody = (ox, oy) => {
    ctx.fillStyle = isPain ? '#fff' : 'rgba(0,180,140,0.4)';
    for (let i = 0; i < 5; i++) {
      const wx = cx + (i - 2) * 8 + ox;
      const wlen = 12 + Math.sin(frame * Math.PI / 2 + i) * 4;
      ctx.beginPath();
      ctx.moveTo(wx - 2, cy + 12 + oy);
      ctx.lineTo(wx - 1, cy + 12 + wlen + oy);
      ctx.lineTo(wx + 1, cy + 12 + wlen + oy);
      ctx.lineTo(wx + 2, cy + 12 + oy);
      ctx.fill();
    }
    ctx.fillStyle = isPain ? '#fff' : '#00ccaa';
    const ringR = 18 * pulse;
    for (let s = 0; s < 8; s++) {
      const a = (s / 8) * Math.PI * 2 + frame * 0.3;
      const sx = cx + Math.cos(a) * ringR + ox;
      const sy = cy + Math.sin(a) * ringR * 0.6 + oy;
      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = isPain ? '#fff' : '#00221a';
    ctx.beginPath(); ctx.arc(cx + ox, cy + oy, 14 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isPain ? '#fff' : '#00ffcc';
    ctx.beginPath(); ctx.arc(cx + ox, cy + oy, 8 * pulse, 0, Math.PI * 2); ctx.fill();
    if (!isPain) {
      ctx.fillStyle = isAttack && frame === 1 ? '#fff' : '#aaffee';
      ctx.beginPath(); ctx.arc(cx + ox, cy + oy, 4 * pulse, 0, Math.PI * 2); ctx.fill();
    }
    if (isAttack && frame === 1) {
      ctx.fillStyle = 'rgba(0,255,200,0.3)';
      ctx.beginPath(); ctx.arc(cx + ox, cy + oy, 28, 0, Math.PI * 2); ctx.fill();
    }
  };
  drawBody(1, 1);
  drawBody(0, 0);
}

function drawLurker(ctx, frame, state) {
  // "The Coil" — a horizontal serpentine form with no eyes, gaping maw.
  const w = SPRITE_W, h = SPRITE_H;
  const isPain = state === 'pain';
  const isAttack = state === 'attack';
  const slither = state === 'walk' ? Math.sin(frame * Math.PI / 2) * 5 : 0;
  const lunge = isAttack ? (frame === 1 ? 8 : 3) : 0;

  const drawBody = (ox, oy) => {
    const segments = 7;
    for (let s = segments - 1; s >= 0; s--) {
      const t = s / segments;
      const sx = w * 0.15 + t * w * 0.70 + ox;
      const sy = h * 0.50 + Math.sin(t * 6 + frame * Math.PI / 2) * 8 + slither * (1 - t) + oy;
      const radius = 10 - s * 0.8;
      ctx.fillStyle = isPain ? '#fff' : (s === 0 ? '#5500aa' : `hsl(270, 60%, ${12 + s * 3}%)`);
      ctx.beginPath(); ctx.arc(sx, sy, radius, 0, Math.PI * 2); ctx.fill();
    }
    const mx = w * 0.15 + lunge + ox;
    const my = h * 0.50 + slither + oy;
    ctx.fillStyle = isPain ? '#fff' : '#220033';
    ctx.beginPath(); ctx.arc(mx, my, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = isPain ? '#fff' : '#000';
    ctx.beginPath(); ctx.arc(mx, my, 8, 0, Math.PI * 2); ctx.fill();
    if (!isPain) {
      ctx.fillStyle = isAttack && frame === 1 ? '#ff0' : '#aa88cc';
      for (let t = 0; t < 6; t++) {
        const a = (t / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(mx + Math.cos(a) * 8, my + Math.sin(a) * 8);
        ctx.lineTo(mx + Math.cos(a) * 3, my + Math.sin(a) * 3);
        ctx.lineTo(mx + Math.cos(a + 0.3) * 8, my + Math.sin(a + 0.3) * 8);
        ctx.fill();
      }
    }
    if (!isPain) {
      ctx.fillStyle = isAttack ? '#ff00aa' : '#8833dd';
      ctx.fillRect(mx + 4, my - 16, 6, 2);
      ctx.fillRect(mx + 4, my + 14, 6, 2);
    }
    if (isAttack && frame === 1) {
      ctx.fillStyle = 'rgba(170,0,200,0.3)';
      ctx.beginPath(); ctx.arc(mx, my, 22, 0, Math.PI * 2); ctx.fill();
    }
  };
  drawBody(1, 1);
  drawBody(0, 0);
}

function drawShard(ctx, frame, state) {
  // "The Prism" — a hovering crystalline monolith with internal glow.
  const w = SPRITE_W, h = SPRITE_H;
  const isPain = state === 'pain';
  const isAttack = state === 'attack';
  const hover = state === 'walk' ? Math.sin(frame * Math.PI / 2) * 3 : 0;
  const glow = isAttack ? (frame === 1 ? 1.5 : 1.2) : 1;
  const cx = w * 0.50, cy = h * 0.45 + hover;

  const drawBody = (ox, oy) => {
    ctx.fillStyle = isPain ? '#fff' : '#1a0500';
    ctx.beginPath();
    ctx.moveTo(cx + ox, cy - 30 + oy);
    ctx.lineTo(cx + 16 + ox, cy - 10 + oy);
    ctx.lineTo(cx + 20 + ox, cy + 15 + oy);
    ctx.lineTo(cx + 12 + ox, cy + 28 + oy);
    ctx.lineTo(cx - 12 + ox, cy + 28 + oy);
    ctx.lineTo(cx - 20 + ox, cy + 15 + oy);
    ctx.lineTo(cx - 16 + ox, cy - 10 + oy);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = isPain ? '#fff' : '#3a1500';
    ctx.beginPath();
    ctx.moveTo(cx + ox, cy - 24 + oy);
    ctx.lineTo(cx + 11 + ox, cy - 8 + oy);
    ctx.lineTo(cx + 14 + ox, cy + 12 + oy);
    ctx.lineTo(cx + 8 + ox, cy + 22 + oy);
    ctx.lineTo(cx - 8 + ox, cy + 22 + oy);
    ctx.lineTo(cx - 14 + ox, cy + 12 + oy);
    ctx.lineTo(cx - 11 + ox, cy - 8 + oy);
    ctx.closePath(); ctx.fill();

    ctx.strokeStyle = isPain ? '#fff' : '#552200';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx + ox, cy - 24 + oy); ctx.lineTo(cx + ox, cy + 22 + oy);
    ctx.moveTo(cx - 14 + ox, cy + 12 + oy); ctx.lineTo(cx + 14 + ox, cy + 12 + oy);
    ctx.moveTo(cx - 11 + ox, cy - 8 + oy); ctx.lineTo(cx + 11 + ox, cy - 8 + oy);
    ctx.stroke();

    if (!isPain) {
      ctx.fillStyle = isAttack ? `rgba(255,150,0,${0.6 * glow})` : 'rgba(255,100,0,0.3)';
      ctx.beginPath(); ctx.arc(cx + ox, cy + 4 + oy, 6 * glow, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isAttack && frame === 1 ? '#fff' : '#ffaa00';
      ctx.beginPath(); ctx.arc(cx + ox, cy + 4 + oy, 3 * glow, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = isPain ? '#fff' : '#2a0a00';
    const fragments = [
      { x: cx + 26, y: cy - 12, s: 5 },
      { x: cx - 28, y: cy + 8, s: 4 },
      { x: cx + 22, y: cy + 20, s: 3 },
      { x: cx - 22, y: cy - 16, s: 4 },
    ];
    for (const f of fragments) {
      const wobble = Math.sin(frame * Math.PI / 2 + f.x) * 2;
      ctx.beginPath();
      ctx.moveTo(f.x + ox, f.y - f.s + wobble + oy);
      ctx.lineTo(f.x + f.s * 0.6 + ox, f.y + wobble + oy);
      ctx.lineTo(f.x + ox, f.y + f.s + wobble + oy);
      ctx.lineTo(f.x - f.s * 0.6 + ox, f.y + wobble + oy);
      ctx.closePath(); ctx.fill();
    }

    if (isAttack && frame === 1) {
      ctx.fillStyle = 'rgba(255,100,0,0.4)';
      ctx.beginPath(); ctx.arc(cx + ox, cy + 4 + oy, 30, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,200,0,0.5)';
      ctx.lineWidth = 2;
      for (let b = 0; b < 4; b++) {
        const a = b * Math.PI / 2 + frame * 0.5;
        ctx.beginPath();
        ctx.moveTo(cx + ox, cy + 4 + oy);
        ctx.lineTo(cx + Math.cos(a) * 30 + ox, cy + 4 + Math.sin(a) * 30 + oy);
        ctx.stroke();
      }
    }
  };
  drawBody(1, 1);
  drawBody(0, 0);
}



function initEnemySprites() {
  const states = ['walk', 'attack', 'pain'];
  const drawFns = { imp: drawImp, demon: drawDemon, wraith: drawWraith, lurker: drawLurker, shard: drawShard };
  for (const type of ['imp', 'demon', 'wraith', 'lurker', 'shard']) {
    enemySprites[type] = {};
    for (const state of states) {
      const frameCount = state === 'walk' ? 4 : (state === 'attack' ? 2 : 1);
      enemySprites[type][state] = [];
      for (let f = 0; f < frameCount; f++) {
        const c = document.createElement('canvas');
        c.width = SPRITE_W; c.height = SPRITE_H;
        const ctx = c.getContext('2d');
        drawFns[type](ctx, f, state);
        enemySprites[type][state].push(c);
      }
    }
    // Death frames: crumple the standing sprite into a bloody heap
    const base = enemySprites[type].walk[0];
    enemySprites[type].death = [];
    const squash = [0.55, 0.4, 0.3], widen = [1.25, 1.45, 1.6], lean = [-0.14, -0.2, -0.26], bloodWash = [0.25, 0.45, 0.65];
    for (let df = 0; df < 3; df++) {
      const c = document.createElement('canvas');
      c.width = SPRITE_W; c.height = SPRITE_H;
      const dc = c.getContext('2d');
      dc.save();
      dc.translate(SPRITE_W / 2, SPRITE_H); // feet anchored at canvas bottom
      dc.rotate(lean[df]);
      dc.scale(widen[df], squash[df]);
      dc.drawImage(base, -SPRITE_W / 2, -SPRITE_H);
      dc.restore();
      // Blood wash + splatter, clipped to the body silhouette
      dc.globalCompositeOperation = 'source-atop';
      dc.fillStyle = `rgba(110,10,10,${bloodWash[df]})`;
      dc.fillRect(0, 0, SPRITE_W, SPRITE_H);
      for (let b = 0; b < 8; b++) {
        const bx = hash(b * 7 + 1, df * 13 + type.length) * SPRITE_W;
        const by = SPRITE_H - hash(b * 7 + 2, df * 13 + type.length) * SPRITE_H * squash[df];
        const br = 1.5 + hash(b * 7 + 3, df * 13 + type.length) * 3.5;
        dc.fillStyle = 'rgba(90,10,10,0.8)';
        dc.beginPath(); dc.arc(bx, by, br, 0, PI2); dc.fill();
      }
      dc.globalCompositeOperation = 'source-over';
      enemySprites[type].death.push(c);
    }
  }
}

initEnemySprites();

// Pre-rendered weapon sprites (first-person view, bottom-right, angled)
const weaponSprites = [];

function initWeaponSprites() {
  // Simple, centered FPS weapons — straight up, viewed from behind.
  // Each sprite is centered horizontally on its canvas.

  function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

  // --- PISTOL --- compact, centered, pointing forward
  weaponSprites[0] = (() => {
    const w = 120, h = 140;
    const c = makeCanvas(w, h), x = c.getContext('2d');

function resize() {

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  // Weapon switching keys 1-4
  if (state === 'playing' && k >= '1' && k <= '4') {

    if (ownedWeapons[wi]) {
      currentWeapon = wi;
      shootTimer = 0;

function toggleMinimap() {
  window.MINIMAP_ON = !window.MINIMAP_ON;

let mouseLocked = false;
canvas.addEventListener('click', () => {
  // Desktop mouse click still fires. Touch taps already fired in touchend — skip
  // the synthesized click (fires ~0-300ms after a tap) to avoid double shots.
  if (lastTouchEndTs && Date.now() - lastTouchEndTs < 500) return;
  if (state === 'playing' && !mouseLocked) canvas.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  mouseLocked = document.pointerLockElement === canvas;
});
document.addEventListener('mousemove', e => {
  if (mouseLocked && state === 'playing') player.angle += e.movementX * 0.003;
});

document.addEventListener('mouseup', e => { if (e.button === 0) firing = false; });

// Mobile joystick + buttons
let joyX = 0, joyY = 0; // -1 to 1
let joyTouchId = null;
const joyZone = document.getElementById('joystick-zone');
const joyThumb = document.getElementById('joystick-thumb');
const joyBase = document.getElementById('joystick-base');

joyZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyTouchId = t.identifier;
  updateJoystick(t);
}, { passive: false });

joyZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) updateJoystick(t);
  }
}, { passive: false });

joyZone.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      joyTouchId = null; joyX = 0; joyY = 0;
      joyThumb.style.left = '45px'; joyThumb.style.top = '45px';
    }
  }
}, { passive: false });

joyZone.addEventListener('touchcancel', e => {
  joyTouchId = null; joyX = 0; joyY = 0;
  joyThumb.style.left = '45px'; joyThumb.style.top = '45px';
}, { passive: false });

function updateJoystick(t) {
  const rect = joyZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const maxR = rect.width / 2 - 25; // 25 = half thumb size
  let dx = t.clientX - cx;
  let dy = t.clientY - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
  joyX = dx / maxR;  // -1 to 1
  joyY = dy / maxR;  // -1 to 1 (negative = forward)
  joyThumb.style.left = (rect.width / 2 - 25 + dx) + 'px';
  joyThumb.style.top  = (rect.height / 2 - 25 + dy) + 'px';
}

// Touch-look on canvas — ANY canvas touch steers the view. (The old
// x>35% / y<80% gate left two dead zones where a look drag silently did
// nothing; the joystick element handles its own touches, and the FIRE
// button zone it avoided was removed long ago.)
let touchLookId = null, touchLookX = 0;
// Tap-to-fire on canvas (fire button removed) — quick taps fire, drags only look.
let touchMoved = false;
let lastTouchEndTs = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); // kill iOS double-tap zoom / callout at the source
  touchMoved = false;
  // First unclaimed canvas touch becomes the look touch; extra fingers ignored.
  if (touchLookId === null) {
    const t = e.changedTouches[0];
    touchLookId = t.identifier; touchLookX = t.clientX;
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); // passive:false — iOS must never scroll/zoom mid-look
  for (const t of e.changedTouches) {
    if (t.identifier === touchLookId && state === 'playing') {
      const raw = t.clientX - touchLookX;
      if (Math.abs(raw) > 8) touchMoved = true;
      player.angle += raw * 0.008;
      // per-event clamp: a stolen 200px pointer jump can't whip the camera
      touchLookX = Math.max(touchLookX - 140, Math.min(t.clientX, touchLookX + 140));
    }
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touchLookId) {
      touchLookId = null;
      lastTouchEndTs = Date.now();
      if (!touchMoved && state === 'playing') shoot(); // tap = fire
    }
  }
}, { passive: false });
// iOS fires touchcancel when a system gesture (edge swipe, notification
// pull, app switcher) steals the touch — without this the look touch
// stays "claimed" forever and look is dead until reload.
canvas.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === touchLookId) touchLookId = null;
  }
});
